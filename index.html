<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Notas Fiscais - Doremus</title>
    
    <!-- Framework Visual (Tailwind CSS) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Biblioteca de Leitura de PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        window.pdfjsLib = window['pdfjs-dist/build/pdf'];
        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }
    </script>

    <!-- Compilador React -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Módulos Externos -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0",
            "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
            "firebase/database": "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js"
        }
    }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            background-color: #f8fafc; 
            overflow: hidden; 
            font-family: 'Inter', sans-serif;
        }
        #root { height: 100%; }

        /* Estilização Profissional de Scroll */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sidebar-active {
            background-color: #f1f5f9;
            color: #1e40af;
            border-left: 4px solid #1e40af;
        }
        
        .card-shadow {
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Plus, List, LayoutDashboard, Upload, Trash2, Search, Paperclip,
            TrendingUp, Calendar, AlertCircle, Clock, Package, CheckCircle2,
            Filter, CalendarDays, Menu, X, FilePlus, UploadCloud, Check, Save,
            ArrowRight, RefreshCw, FileText, Briefcase, Settings
        } from 'lucide-react';
        
        import { initializeApp } from 'firebase/app';
        import { getDatabase, ref, onValue, set, remove, update, get } from 'firebase/database';

        // CONFIGURAÇÃO FIREBASE OFICIAL (sistemanotas-523ac)
        const firebaseConfig = {
            apiKey: "AIzaSyBLtWbeKw9gWD1kPd8DL_r5gG2FQ1PJBC8",
            authDomain: "sistemanotas-523ac.firebaseapp.com",
            databaseURL: "https://sistemanotas-523ac-default-rtdb.firebaseio.com",
            projectId: "sistemanotas-523ac",
            storageBucket: "sistemanotas-523ac.firebasestorage.app",
            messagingSenderId: "120014924067",
            appId: "1:120014924067:web:01030e38cd66f9b9de4496",
            measurementId: "G-XBMC5RPQ0N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const gerarID = () => Date.now().toString(36) + Math.random().toString(36).substr(2, 5);

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [searchTerm, setSearchTerm] = useState('');
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [previewNota, setPreviewNota] = useState(null); 
            const [notas, setNotas] = useState([]);
            const [carregando, setCarregando] = useState(true);
            const [erroConexao, setErroConexao] = useState(false);
            
            const [filtroTipo, setFiltroTipo] = useState('todas');
            const [filtroStatus, setFiltroStatus] = useState('todos');
            const [filtroMes, setFiltroMes] = useState('todos');

            useEffect(() => {
                const notasRef = ref(db, 'notasFiscais');
                const unsubscribe = onValue(notasRef, (snapshot) => {
                    const data = snapshot.val();
                    const notasArray = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
                    notasArray.sort((a, b) => new Date(b.dataUpload) - new Date(a.dataUpload));
                    setNotas(notasArray);
                    setCarregando(false);
                }, (err) => setErroConexao(true));
                return () => unsubscribe();
            }, []);

            const salvarNota = async (novaNota) => {
                try {
                    const id = novaNota.id || gerarID();
                    const base64 = novaNota.arquivoDataUrl;
                    const dadosLista = { ...novaNota, id };
                    delete dadosLista.arquivoDataUrl;

                    await set(ref(db, 'notasFiscais/' + id), dadosLista);
                    if (base64) await set(ref(db, 'arquivos/' + id), base64);
                    setActiveTab('historico');
                } catch (e) { alert("Erro de sincronização."); }
            };

            const salvarLote = async (lote) => {
                setCarregando(true);
                for (const n of lote) await salvarNota(n);
                setCarregando(false);
            };

            const deletarNota = async (id) => {
                if(window.confirm('Excluir registro permanentemente?')) {
                    await remove(ref(db, 'notasFiscais/' + id));
                    await remove(ref(db, 'arquivos/' + id));
                }
            };

            const alternarStatus = async (id, status) => {
                const novo = status === 'pendente' ? 'lancada' : 'pendente';
                await update(ref(db, 'notasFiscais/' + id), { status: novo });
            };

            const abrirVisualizacao = async (nota) => {
                setPreviewNota({ ...nota, carregandoAnexo: true });
                try {
                    const snap = await get(ref(db, 'arquivos/' + nota.id));
                    if (snap.exists()) {
                        setPreviewNota({ ...nota, arquivoDataUrl: snap.val(), carregandoAnexo: false });
                    } else {
                        alert("Arquivo indisponível.");
                        setPreviewNota(null);
                    }
                } catch (e) { setPreviewNota(null); }
            };

            const notasFiltradas = notas.filter(n => {
                const matchBusca = n.numero.includes(searchTerm) || (n.fornecedor && n.fornecedor.toLowerCase().includes(searchTerm.toLowerCase()));
                const matchTipo = filtroTipo === 'todas' || n.tipo === filtroTipo;
                const matchStatus = filtroStatus === 'todos' || n.status === filtroStatus;
                const mesNota = n.dataLancamento ? n.dataLancamento.split('-')[1] : null;
                const matchMes = filtroMes === 'todos' || mesNota === filtroMes;
                return matchBusca && matchTipo && matchStatus && matchMes;
            });

            const totalVendas = notas.filter(n => n.tipo === 'venda').reduce((acc, n) => acc + parseFloat(n.valor || 0), 0);
            const totalAmostras = notas.filter(n => n.tipo === 'amostra').reduce((acc, n) => acc + parseFloat(n.valor || 0), 0);
            const pendentes = notas.filter(n => n.status === 'pendente').length;

            return (
                <div className="flex h-screen overflow-hidden">
                    
                    {/* MODAL DE VISUALIZAÇÃO PROFISSIONAL */}
                    {previewNota && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 sm:p-10 animate-fade-in">
                            <div className="bg-white rounded-lg w-full max-w-6xl h-full flex flex-col shadow-2xl overflow-hidden border border-slate-200">
                                <div className="flex justify-between items-center px-6 py-4 border-b bg-slate-50">
                                    <div className="flex items-center gap-3">
                                        <div className="p-2 bg-blue-600 text-white rounded">
                                            <FileText size={18}/>
                                        </div>
                                        <div>
                                            <h3 className="text-sm font-semibold text-slate-800">{previewNota.arquivoNome}</h3>
                                            <p className="text-[11px] text-slate-500 font-medium">DOCUMENTO Nº {previewNota.numero} • {previewNota.fornecedor}</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setPreviewNota(null)} className="p-2 hover:bg-slate-200 rounded-md transition-all">
                                        <X size={20} className="text-slate-500" />
                                    </button>
                                </div>
                                <div className="flex-1 bg-slate-100 p-4 overflow-hidden flex items-center justify-center">
                                    {previewNota.carregandoAnexo ? (
                                        <div className="flex flex-col items-center gap-3">
                                            <RefreshCw className="animate-spin text-blue-600" size={32}/>
                                            <span className="text-xs font-semibold text-slate-500 tracking-wide uppercase">A processar ficheiro...</span>
                                        </div>
                                    ) : <iframe src={previewNota.arquivoDataUrl} className="w-full h-full rounded border border-slate-300 bg-white"></iframe>}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SIDEBAR CORPORATIVA */}
                    <aside className={`bg-white border-r border-slate-200 flex flex-col transition-all duration-300 ${isSidebarOpen ? 'w-64' : 'w-0 -translate-x-full md:translate-x-0 md:w-20'} z-50 overflow-hidden`}>
                        <div className="p-6 flex items-center gap-3 border-b border-slate-100 h-20">
                            <div className="w-8 h-8 bg-blue-700 rounded flex items-center justify-center text-white shrink-0 shadow-lg shadow-blue-200">
                                <Briefcase size={18} />
                            </div>
                            <span className={`font-bold text-slate-800 tracking-tight whitespace-nowrap ${!isSidebarOpen && 'hidden'}`}>Admin Notas</span>
                        </div>
                        
                        <nav className="flex-1 py-6">
                            <div className={`px-6 mb-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest ${!isSidebarOpen && 'hidden'}`}>Painel de Controle</div>
                            <SidebarItem active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} icon={<LayoutDashboard size={20}/>} label="Dashboard" expanded={isSidebarOpen} />
                            <SidebarItem active={activeTab === 'lancar'} onClick={() => setActiveTab('lancar')} icon={<Plus size={20}/>} label="Novo Registro" expanded={isSidebarOpen} />
                            <SidebarItem active={activeTab === 'lote'} onClick={() => setActiveTab('lote')} icon={<UploadCloud size={20}/>} label="Importação em Lote" expanded={isSidebarOpen} />
                            <SidebarItem active={activeTab === 'historico'} onClick={() => setActiveTab('historico')} icon={<List size={20}/>} label="Base de Dados" expanded={isSidebarOpen} badge={notas.filter(n=>n.status==='pendente').length} />
                        </nav>

                        {/* ÁREA DA MASCOTE - Estilo Suporte Profissional */}
                        <div className="p-4 mt-auto border-t border-slate-100 bg-slate-50/50">
                            <div className={`flex flex-col items-center text-center ${!isSidebarOpen && 'opacity-0'}`}>
                                <img src="https://i.postimg.cc/j29ntZXm/4768DAA3-8F2D-4780-8252-D97E005EF5C4-removebg-preview.png" className="w-28 hover:scale-105 transition-transform duration-300 drop-shadow-sm" />
                                <div className="mt-2 bg-white border border-slate-200 p-3 rounded-lg shadow-sm">
                                    <p className="text-[10px] font-bold text-slate-700 leading-tight uppercase tracking-tight">Suporte Técnico</p>
                                    <p className="text-[11px] text-slate-500 mt-1 font-medium">Monitorização ativa dos lançamentos e sincronização cloud.</p>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* CONTEÚDO PRINCIPAL */}
                    <div className="flex-1 flex flex-col h-full relative overflow-hidden">
                        <header className="bg-white border-b border-slate-200 h-20 px-8 flex items-center justify-between shrink-0 shadow-sm z-40">
                            <div className="flex items-center gap-6">
                                <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-2.5 text-slate-400 hover:text-blue-600 hover:bg-slate-50 rounded-md transition-all border border-transparent hover:border-slate-200">
                                    <Menu size={20}/>
                                </button>
                                <div className="h-10 w-px bg-slate-200 hidden md:block"></div>
                                {/* LOGO ATUALIZADA CONFORME SOLICITAÇÃO */}
                                <a href='https://postimg.cc/qgvMZTFh' target='_blank' className="hidden sm:block">
                                    <img src='https://i.postimg.cc/MZyMHZbD/as-02-(1).png' className="h-8" border='0' alt='Logo Corporativa' />
                                </a>
                            </div>
                            
                            <div className="flex items-center gap-4">
                                <div className="flex items-center gap-2 text-[11px] font-bold text-slate-500 bg-slate-50 px-4 py-2 rounded-full border border-slate-100 uppercase tracking-widest">
                                    {carregando ? <RefreshCw size={14} className="animate-spin text-blue-500"/> : <CheckCircle2 size={14} className="text-emerald-500"/>}
                                    {carregando ? 'Sincronizando' : 'Cloud Conectada'}
                                </div>
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto custom-scrollbar">
                            <div className="max-w-7xl mx-auto p-8 lg:p-12">
                                
                                {activeTab === 'dashboard' && (
                                    <div className="space-y-10 animate-fade-in">
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                            <StatCard title="Volume de Vendas" val={`R$ ${totalVendas.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`} icon={<TrendingUp size={22}/>} color="text-blue-600" />
                                            <StatCard title="Amostras" val={`R$ ${totalAmostras.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`} icon={<Package size={22}/>} color="text-slate-600" />
                                            <StatCard title="Pendentes" val={pendentes} icon={<Clock size={22}/>} color="text-amber-600" highlight={pendentes > 0} />
                                            <StatCard title="Último Lançamento" val={notas[0] ? formatData(notas[0].dataLancamento) : '--/--'} icon={<Calendar size={22}/>} color="text-slate-500" />
                                        </div>

                                        <div className="bg-white rounded-lg border border-slate-200 shadow-sm">
                                            <div className="px-8 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/30">
                                                <h3 className="text-xs font-bold text-slate-800 uppercase tracking-[0.1em]">Registros Recentes</h3>
                                                <button onClick={() => setActiveTab('historico')} className="text-blue-700 text-xs font-bold hover:underline uppercase">Tabela Geral</button>
                                            </div>
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left text-sm">
                                                    <thead>
                                                        <tr className="text-slate-400 font-semibold border-b border-slate-100 uppercase text-[10px] tracking-widest bg-slate-50/20">
                                                            <th className="px-8 py-4">Fatura</th>
                                                            <th className="px-8 py-4">Parceiro</th>
                                                            <th className="px-8 py-4 text-right">Valor</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {notas.length === 0 ? (
                                                            <tr><td colSpan="3" className="py-20 text-center text-slate-400 italic">Nenhum dado sincronizado.</td></tr>
                                                        ) : notas.slice(0, 6).map(n => (
                                                            <tr key={n.id} className="hover:bg-slate-50/80 transition-colors">
                                                                <td className="px-8 py-4 font-bold text-slate-700">#{n.numero}</td>
                                                                <td className="px-8 py-4 text-slate-500 font-medium">{n.fornecedor || '---'}</td>
                                                                <td className="px-8 py-4 text-right font-bold text-slate-800">R$ {parseFloat(n.valor).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'lancar' && (
                                    <div className="max-w-4xl mx-auto animate-fade-in">
                                        <div className="mb-10">
                                            <h2 className="text-2xl font-bold text-slate-800 tracking-tight uppercase">Entrada de Documento</h2>
                                            <p className="text-sm text-slate-500 mt-1 font-medium italic">O sistema extrairá os dados dos campos automaticamente.</p>
                                        </div>
                                        <FormIndividual onSave={salvarNota} />
                                    </div>
                                )}

                                {activeTab === 'lote' && (
                                    <div className="max-w-5xl mx-auto animate-fade-in">
                                        <div className="mb-10 text-center uppercase tracking-tight">
                                            <h2 className="text-2xl font-bold text-slate-800">Sincronização em Massa</h2>
                                            <p className="text-sm text-slate-500 mt-2 font-medium tracking-normal normal-case">Processamento simultâneo de múltiplos documentos XML/PDF.</p>
                                        </div>
                                        <FormLote onSave={salvarLote} />
                                    </div>
                                )}

                                {activeTab === 'historico' && (
                                    <div className="space-y-6 animate-fade-in">
                                        <div className="flex flex-col lg:flex-row gap-4 items-center bg-white p-6 rounded-lg border border-slate-200 card-shadow">
                                            <div className="flex-1 w-full relative">
                                                <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18}/>
                                                <input className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all text-sm font-medium" placeholder="Filtrar por nº da nota ou parceiro..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                                            </div>
                                            <div className="flex gap-1.5 p-1 bg-slate-100 rounded">
                                                <FilterBtn active={filtroTipo === 'todas'} onClick={() => setFiltroTipo('todas')} label="Todos" />
                                                <FilterBtn active={filtroTipo === 'venda'} onClick={() => setFiltroTipo('venda')} label="Vendas" />
                                                <FilterBtn active={filtroTipo === 'amostra'} onClick={() => setFiltroTipo('amostra')} label="Amostras" />
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-lg border border-slate-200 card-shadow overflow-hidden flex flex-col h-full min-h-[600px]">
                                            <div className="overflow-x-auto flex-1">
                                                <table className="w-full text-left text-sm border-collapse min-w-[1100px]">
                                                    <thead className="bg-slate-50/80 border-b border-slate-200 font-bold text-slate-500 uppercase text-[10px] tracking-widest sticky top-0 z-10 backdrop-blur-md">
                                                        <tr>
                                                            <th className="px-6 py-4">Status</th>
                                                            <th className="px-6 py-4">Fatura</th>
                                                            <th className="px-6 py-4">Parceiro Comercial</th>
                                                            <th className="px-6 py-4">Data Lanç.</th>
                                                            <th className="px-6 py-4 text-right">Valor Total</th>
                                                            <th className="px-6 py-4 text-center">Arquivo</th>
                                                            <th className="px-6 py-4 text-right">Ações</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100 font-medium">
                                                        {notasFiltradas.length === 0 ? (
                                                            <tr><td colSpan="7" className="py-32 text-center text-slate-400 font-medium italic">Nenhum registro localizado.</td></tr>
                                                        ) : notasFiltradas.map(n => (
                                                            <tr key={n.id} className={`hover:bg-slate-50 transition-colors ${n.status === 'pendente' ? 'bg-amber-50/5' : ''}`}>
                                                                <td className="px-6 py-4">
                                                                    <button onClick={() => alternarStatus(n.id, n.status)} className={`px-3 py-1 rounded text-[10px] font-bold uppercase tracking-wider border shadow-sm transition-all active:scale-95 ${n.status === 'pendente' ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'}`}>
                                                                        {n.status}
                                                                    </button>
                                                                </td>
                                                                <td className="px-6 py-4 font-bold text-slate-800">#{n.numero}</td>
                                                                <td className="px-6 py-4 text-slate-500 font-medium truncate max-w-[200px]">{n.fornecedor || '---'}</td>
                                                                <td className="px-6 py-4 text-slate-500 font-bold text-xs">{formatData(n.dataLancamento)}</td>
                                                                <td className="px-6 py-4 text-right font-bold text-slate-800 tracking-tight">R$ {parseFloat(n.valor).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                                                                <td className="px-6 py-4 text-center">
                                                                    <button onClick={() => abrirVisualizacao(n)} className="p-2 text-blue-600 hover:bg-blue-100 rounded transition-all">
                                                                        <Paperclip size={18}/>
                                                                    </button>
                                                                </td>
                                                                <td className="px-6 py-4 flex justify-end gap-1">
                                                                    {n.status === 'pendente' && (
                                                                        <button onClick={() => alternarStatus(n.id, n.status)} className="p-2 text-emerald-600 hover:bg-emerald-100 rounded transition-all" title="Confirmar">
                                                                            <CheckCircle2 size={18}/>
                                                                        </button>
                                                                    )}
                                                                    <button onClick={() => deletarNota(n.id)} className="p-2 text-slate-300 hover:text-red-600 rounded transition-all" title="Remover">
                                                                        <Trash2 size={18}/>
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                            <div className="px-8 py-4 bg-slate-50 border-t border-slate-200 flex justify-between items-center text-[10px] font-bold text-slate-500 tracking-widest uppercase">
                                                <span>Registros localizados: {notasFiltradas.length}</span>
                                                <span className="text-slate-800">Total: R$ {notasFiltradas.reduce((acc, n) => acc + parseFloat(n.valor || 0), 0).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        // --- COMPONENTES AUXILIARES ---

        const extrairDados = async (file) => {
            if (file.name.toLowerCase().endsWith('.pdf')) {
                try {
                    const ab = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument({ data: ab }).promise;
                    let text = '';
                    for (let i = 1; i <= Math.min(pdf.numPages, 2); i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        text += content.items.map(it => it.str).join(' ') + ' ';
                    }
                    const dataM = text.match(/(\d{2})\/(\d{2})\/(\d{4})/);
                    const valorM = text.match(/R\$\s*([\d\.]+,\d{2})/i) || text.match(/Valor.*?([\d\.]+,\d{2})/i);
                    const numM = text.match(/(?:NF|N[oó]ta|Nº)\s*[:.-]?\s*(\d{3,})/i);
                    return {
                        numero: numM ? numM[1] : '',
                        fornecedor: text.match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/) ? `CNPJ: ${text.match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/)[0]}` : '',
                        dataLancamento: dataM ? `${dataM[3]}-${dataM[2]}-${dataM[1]}` : new Date().toISOString().split('T')[0],
                        valor: valorM ? valorM[1].replace(/\./g, '').replace(',', '.') : ''
                    };
                } catch(e) { return { numero: '', fornecedor: '', dataLancamento: new Date().toISOString().split('T')[0], valor: '' }; }
            } else {
                const text = await file.text();
                const xml = new DOMParser().parseFromString(text, "text/xml");
                const get = t => xml.getElementsByTagName(t)[0]?.textContent || '';
                return {
                    numero: get('nNF') || get('Numero') || get('NfseNumero') || '',
                    fornecedor: xml.getElementsByTagName('emit')[0]?.getElementsByTagName('xNome')[0]?.textContent || get('RazaoSocial') || '',
                    dataLancamento: (get('dhEmi') || get('dEmi') || get('DataEmissao'))?.split('T')[0] || new Date().toISOString().split('T')[0],
                    valor: get('vNF') || get('ValorServicos') || get('ValorLiquidoNfse') || ''
                };
            }
        };

        function FormIndividual({ onSave }) {
            const [f, setF] = useState({ numero: '', fornecedor: '', dataLancamento: new Date().toISOString().split('T')[0], valor: '', tipo: 'venda', status: 'pendente' });
            const [arq, setArq] = useState(null);
            const [lendo, setLendo] = useState(false);

            const handleFile = async (e) => {
                const file = e.target.files[0]; if(!file) return; setLendo(true);
                const d = await extrairDados(file); setF(p => ({...p, ...d}));
                const reader = new FileReader(); reader.onload = (ev) => { setArq({ name: file.name, data: ev.target.result }); setLendo(false); };
                reader.readAsDataURL(file);
            };

            return (
                <form onSubmit={e => { e.preventDefault(); onSave({...f, id: gerarID(), arquivoNome: arq?.name, arquivoDataUrl: arq?.data, dataUpload: new Date().toISOString() }); setF({ numero: '', fornecedor: '', dataLancamento: new Date().toISOString().split('T')[0], valor: '', tipo: 'venda', status: 'pendente' }); setArq(null); }} className="bg-white p-10 rounded-lg border border-slate-200 card-shadow space-y-8 animate-fade-in">
                    <div className="border border-slate-200 p-8 rounded bg-slate-50/50 text-center relative group hover:bg-blue-50/20 transition-all cursor-pointer">
                        <input type="file" accept=".xml,.pdf" className="absolute inset-0 opacity-0 cursor-pointer z-10" onChange={handleFile} />
                        <div className={`mx-auto w-12 h-12 bg-white border border-slate-200 rounded flex items-center justify-center text-slate-400 mb-3 shadow-sm transition-all group-hover:text-blue-600 ${lendo ? 'animate-pulse' : ''}`}>
                            <UploadCloud size={24} />
                        </div>
                        <p className="font-bold text-slate-700 text-sm uppercase tracking-tight">{arq ? arq.name : 'Selecionar Documento Digital (XML/PDF)'}</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-6">
                        <div className="md:col-span-2 flex bg-slate-100 p-1 rounded border border-slate-200">
                            <button type="button" onClick={() => setF({...f, tipo: 'venda'})} className={`flex-1 py-3 text-[10px] font-bold rounded transition-all uppercase tracking-widest ${f.tipo === 'venda' ? 'bg-white shadow text-blue-700' : 'text-slate-500 hover:text-slate-700'}`}>Nota de Venda</button>
                            <button type="button" onClick={() => setF({...f, tipo: 'amostra'})} className={`flex-1 py-3 text-[10px] font-bold rounded transition-all uppercase tracking-widest ${f.tipo === 'amostra' ? 'bg-white shadow text-slate-700' : 'text-slate-500 hover:text-slate-700'}`}>Amostra Comercial</button>
                        </div>
                        
                        <div className="space-y-1.5"><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Número da Nota</label><input required className="w-full border border-slate-200 p-3 rounded font-bold text-slate-800 outline-none focus:ring-1 focus:ring-blue-500/30 focus:border-blue-500 transition-all bg-slate-50/30" value={f.numero} onChange={e => setF({...f, numero: e.target.value})} /></div>
                        <div className="space-y-1.5"><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Data Lançamento</label><input type="date" required className="w-full border border-slate-200 p-3 rounded font-bold text-slate-800 outline-none focus:ring-1 focus:ring-blue-500/30 focus:border-blue-500 transition-all bg-slate-50/30" value={f.dataLancamento} onChange={e => setF({...f, dataLancamento: e.target.value})} /></div>
                        <div className="space-y-1.5 md:col-span-2"><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Parceiro Comercial / Fornecedor</label><input className="w-full border border-slate-200 p-3 rounded font-bold text-slate-800 outline-none focus:ring-1 focus:ring-blue-500/30 focus:border-blue-500 transition-all bg-slate-50/30" value={f.fornecedor} onChange={e => setF({...f, fornecedor: e.target.value})} /></div>
                        <div className="space-y-1.5 md:col-span-2"><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Valor Bruto (R$)</label><input type="number" step="0.01" required className="w-full border border-slate-200 p-3 rounded font-bold text-slate-800 outline-none focus:ring-1 focus:ring-blue-500/30 focus:border-blue-500 transition-all bg-slate-50/30" value={f.valor} onChange={e => setF({...f, valor: e.target.value})} /></div>
                    </div>

                    <button className="w-full bg-blue-700 text-white p-5 rounded font-bold text-xs hover:bg-blue-800 transition-all shadow-md flex items-center justify-center gap-2 active:scale-95 uppercase tracking-[0.2em]">
                        <Save size={16}/> Sincronizar na Cloud
                    </button>
                </form>
            );
        }

        function FormLote({ onSave }) {
            const [l, setL] = useState([]); const [p, setP] = useState(false);
            const handleFiles = async (e) => {
                setP(true); const files = Array.from(e.target.files);
                const novas = await Promise.all(files.map(async file => {
                    const d = await extrairDados(file);
                    const b64 = await new Promise(res => { const r = new FileReader(); r.onload = ev => res(ev.target.result); r.readAsDataURL(file); });
                    return { ...d, id: gerarID(), arquivoNome: file.name, arquivoDataUrl: b64, tipo: 'venda', status: 'pendente', dataUpload: new Date().toISOString() };
                }));
                setL(prev => [...prev, ...novas]); setP(false);
            };
            return (
                <div className="space-y-8 h-full flex flex-col animate-fade-in">
                    <div className="bg-white p-20 border border-slate-300 rounded text-center relative group hover:border-blue-400 hover:bg-blue-50/10 transition-all cursor-pointer">
                        <input type="file" multiple accept=".xml,.pdf" className="absolute inset-0 opacity-0 cursor-pointer z-10" onChange={handleFiles} />
                        <div className={`mx-auto w-16 h-16 bg-slate-50 border border-slate-200 rounded flex items-center justify-center text-slate-400 mb-6 transition-all group-hover:text-blue-600 ${p ? 'animate-spin' : ''}`}><UploadCloud size={32} /></div>
                        <p className="font-bold text-lg text-slate-800 tracking-tight uppercase">Carregamento Múltiplo de Notas</p>
                        <p className="text-slate-400 text-xs font-medium mt-1 uppercase tracking-widest">Processamento simultâneo de até 50 ficheiros</p>
                    </div>
                    {l.length > 0 && (
                        <div className="bg-white border border-slate-200 rounded overflow-hidden card-shadow flex flex-col flex-1 animate-fade-in">
                            <div className="p-6 bg-slate-900 text-white font-bold flex justify-between items-center text-[10px] uppercase tracking-widest">
                                <span>Lote de Sincronização: {l.length} Ficheiros</span>
                                <button onClick={() => setL([])} className="opacity-60 hover:opacity-100 transition-opacity">Limpar Fila</button>
                            </div>
                            <div className="max-h-96 overflow-y-auto custom-scrollbar">
                                <table className="w-full text-[11px] text-left">
                                    <tbody className="divide-y divide-slate-100 font-medium">
                                        {l.map(x => (
                                            <tr key={x.id} className="hover:bg-slate-50 transition-colors">
                                                <td className="px-8 py-4 text-slate-500 uppercase">{x.arquivoNome}</td>
                                                <td className="px-8 py-4 font-bold text-slate-800">#{x.numero || '---'}</td>
                                                <td className="px-8 py-4 text-right font-bold text-blue-700 text-xs">R$ {parseFloat(x.valor || 0).toLocaleString('pt-BR')}</td>
                                                <td className="px-8 py-4 text-right"><button onClick={() => setL(l.filter(it => it.id !== x.id))} className="text-slate-300 hover:text-red-500 p-2"><Trash2 size={16}/></button></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            <button onClick={() => { onSave(l); setL([]); }} className="w-full bg-blue-700 text-white p-6 font-bold text-xs hover:bg-blue-800 transition-all uppercase tracking-[0.25em]">
                                Confirmar Upload em Lote
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        // COMPONENTES DE INTERFACE
        function SidebarItem({ active, onClick, icon, label, expanded, badge }) {
            return (
                <button onClick={onClick} className={`w-full flex items-center justify-between p-4 px-6 transition-all font-bold text-[10px] uppercase tracking-widest ${active ? 'sidebar-active shadow-sm' : 'text-slate-400 hover:text-slate-800 hover:bg-slate-50'}`}>
                    <div className="flex items-center gap-4">{icon} <span className={!expanded ? 'hidden' : ''}>{label}</span></div>
                    {badge > 0 && expanded && <span className="bg-amber-100 text-amber-800 text-[9px] px-2 py-0.5 rounded border border-amber-200 font-black tracking-tighter">{badge}</span>}
                </button>
            );
        }
        
        function StatCard({ title, val, icon, color, highlight }) {
            return (
                <div className={`bg-white p-6 rounded border border-slate-200 relative card-shadow group transition-all duration-300 ${highlight ? 'border-amber-200 bg-amber-50/5' : 'hover:border-blue-200'}`}>
                    <div className="flex justify-between items-start">
                        <div>
                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-[0.15em] mb-2">{title}</p>
                            <h2 className="text-xl font-bold text-slate-800 tracking-tight">{val}</h2>
                        </div>
                        <div className={`p-2 rounded bg-slate-50 text-slate-400 group-hover:bg-blue-50 group-hover:text-blue-700 transition-all border border-slate-100 ${color}`}>{icon}</div>
                    </div>
                </div>
            );
        }
        
        function FilterBtn({ active, onClick, label }) {
            return <button onClick={onClick} className={`px-5 py-2 text-[9px] font-bold rounded transition-all uppercase tracking-widest ${active ? 'bg-white shadow-sm text-blue-800 border border-slate-200' : 'text-slate-400 hover:text-slate-800'}`}>{label}</button>;
        }
        
        function formatData(s) { if(!s) return '-'; const p = s.split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
