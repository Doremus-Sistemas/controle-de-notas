<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Notas Lançadas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0",
            "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
            "firebase/database": "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js"
        }
    }
    </script>

    <style>
        html, body { height: 100%; margin: 0; padding: 0; background-color: #f3f4f6; }
        #root { height: 100%; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Plus, List, LayoutDashboard, Upload, Trash2, Search, Paperclip,
            TrendingUp, Calendar, AlertCircle, Clock, Package, CheckCircle2,
            Filter, CalendarDays, Menu, X, FilePlus, UploadCloud, Check
        } from 'lucide-react';
        
        // Importações do Firebase Realtime Database
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getDatabase, ref, onValue, set, remove, update } from 'firebase/database';

        // Suas Chaves Oficiais do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBLtWbeKw9gWD1kPd8DL_r5gG2FQ1PJBC8",
            authDomain: "sistemanotas-523ac.firebaseapp.com",
            databaseURL: "https://sistemanotas-523ac-default-rtdb.firebaseio.com",
            projectId: "sistemanotas-523ac",
            storageBucket: "sistemanotas-523ac.firebasestorage.app",
            messagingSenderId: "120014924067",
            appId: "1:120014924067:web:01030e38cd66f9b9de4496"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        function App() {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [notas, setNotas] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            
            const [filtroTipo, setFiltroTipo] = useState('todas');
            const [filtroStatus, setFiltroStatus] = useState('todos');
            const [filtroMes, setFiltroMes] = useState('todos');

            // Autenticação Silenciosa
            useEffect(() => {
                signInAnonymously(auth).catch(error => console.error("Erro de Auth:", error));
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // Ler Notas da Nuvem (Tempo Real)
            useEffect(() => {
                if (!user) return;
                const notasRef = ref(db, 'notasFiscais');
                const unsubscribe = onValue(notasRef, (snapshot) => {
                    const data = snapshot.val();
                    const notasArray = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
                    notasArray.sort((a, b) => new Date(b.dataUpload) - new Date(a.dataUpload));
                    setNotas(notasArray);
                });
                return () => unsubscribe();
            }, [user]);

            // Salvar na Nuvem
            const salvarNota = async (novaNota) => {
                if (!user) return;
                await set(ref(db, 'notasFiscais/' + novaNota.id), novaNota);
                setActiveTab('historico');
            };

            const salvarLote = async (loteNotas) => {
                if (!user) return;
                for (const nota of loteNotas) {
                    await set(ref(db, 'notasFiscais/' + nota.id), nota);
                }
                setActiveTab('historico');
            };

            // Excluir e Atualizar na Nuvem
            const deletarNota = async (id) => {
                if(window.confirm('Tem certeza que deseja excluir esta nota para toda a equipe?')) {
                    await remove(ref(db, 'notasFiscais/' + id));
                }
            };

            const alternarStatus = async (id, statusAtual) => {
                const novoStatus = statusAtual === 'pendente' ? 'lancada' : 'pendente';
                await update(ref(db, 'notasFiscais/' + id), { status: novoStatus });
            };

            const notasVenda = notas.filter(n => n.tipo === 'venda');
            const notasAmostra = notas.filter(n => n.tipo === 'amostra');
            const notasPendentes = notas.filter(n => n.status === 'pendente');
            const totalValorVendas = notasVenda.reduce((acc, nota) => acc + parseFloat(nota.valor || 0), 0);
            const totalValorAmostras = notasAmostra.reduce((acc, nota) => acc + parseFloat(nota.valor || 0), 0);

            const notasFiltradas = notas.filter(nota => {
                const mesNota = nota.dataLancamento ? nota.dataLancamento.split('-')[1] : null;
                const matchBusca = nota.numero.includes(searchTerm) || (nota.fornecedor && nota.fornecedor.toLowerCase().includes(searchTerm.toLowerCase()));
                const matchTipo = filtroTipo === 'todas' || nota.tipo === filtroTipo;
                const matchStatus = filtroStatus === 'todos' || nota.status === filtroStatus;
                const matchMes = filtroMes === 'todos' || mesNota === filtroMes;
                return matchBusca && matchTipo && matchStatus && matchMes;
            });

            return (
                <div className="h-screen bg-[#f3f4f6] flex overflow-hidden font-sans text-slate-800">
                    <aside className={`bg-white text-slate-700 flex flex-col shadow-xl z-20 border-r border-slate-200 transition-all duration-300 ease-in-out absolute md:relative h-full overflow-hidden shrink-0 ${isSidebarOpen ? 'w-64 translate-x-0' : 'w-0 -translate-x-full md:translate-x-0'}`}>
                        <div className="w-64 min-w-[16rem] flex flex-col h-full bg-white">
                            <div className="p-6 flex flex-col justify-center items-center border-b border-slate-100 min-h-[5rem] relative">
                                <button onClick={() => setIsSidebarOpen(false)} className="md:hidden absolute top-4 right-4 text-slate-400"><X size={20} /></button>
                                <div className="text-center w-full mt-1">
                                    <h1 className="text-sm font-bold text-slate-800 leading-tight">Controle de Notas</h1>
                                    <p className="text-xs text-blue-600 font-semibold mt-0.5">Nuvem Ativa</p>
                                </div>
                            </div>
                            
                            <div className="px-4 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Menu Principal</div>
                            
                            <nav className="flex-1 px-3 space-y-1 overflow-y-auto">
                                <MenuButton active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} icon={<LayoutDashboard size={20} />} label="Visão Geral" />
                                <MenuButton active={activeTab === 'lancar'} onClick={() => setActiveTab('lancar')} icon={<Plus size={20} />} label="Novo Lançamento" />
                                <MenuButton active={activeTab === 'lote'} onClick={() => setActiveTab('lote')} icon={<UploadCloud size={20} />} label="Lançamento em Massa" badge="Novo" />
                                <MenuButton active={activeTab === 'historico'} onClick={() => setActiveTab('historico')} icon={<List size={20} />} label="Base de Notas" badge={notasPendentes.length > 0 ? notasPendentes.length : null} />
                            </nav>

                            <div className="mt-auto p-4 flex flex-col items-center pb-6 w-full shrink-0 group">
                                <img src="https://i.postimg.cc/j29ntZXm/4768DAA3-8F2D-4780-8252-D97E005EF5C4-removebg-preview.png" alt="Mascote" className="w-44 h-auto drop-shadow-xl object-contain transform group-hover:-translate-y-3 group-hover:scale-110 transition-all duration-300" />
                            </div>
                        </div>
                    </aside>

                    <div className="flex-1 flex flex-col h-screen overflow-hidden min-w-0 relative">
                        <header className="bg-white border-b border-slate-200 h-16 px-4 flex items-center justify-between shrink-0 z-10 shadow-sm">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-2 -ml-2 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-blue-600 transition-colors"><Menu size={22} /></button>
                                <img src="https://i.postimg.cc/MZyMHZbD/as-02-(1).png" alt="Logo" className="h-9 w-auto object-contain hidden sm:block" />
                            </div>
                            <div className="flex items-center gap-3 text-sm">
                                {user ? (
                                    <span className="flex items-center gap-1.5 bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-xs font-medium border border-emerald-200"><CheckCircle2 size={14}/> Online para a Equipe</span>
                                ) : (
                                    <span className="flex items-center gap-1.5 bg-amber-50 text-amber-700 px-3 py-1 rounded-full text-xs font-medium"><Clock size={14}/> Conectando...</span>
                                )}
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto">
                            {activeTab === 'dashboard' && (
                                <div className="p-6 md:p-8 space-y-8 max-w-7xl mx-auto animate-fade-in">
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                        <StatCard title="Total Vendas" value={`R$ ${totalValorVendas.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`} subtitle={`${notasVenda.length} notas`} icon={<TrendingUp className="text-emerald-600" size={24} />} accent="bg-emerald-500"/>
                                        <StatCard title="Total Amostras" value={`R$ ${totalValorAmostras.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`} subtitle={`${notasAmostra.length} notas`} icon={<Package className="text-purple-600" size={24} />} accent="bg-purple-500"/>
                                        <StatCard title="Aguardando Lançamento" value={notasPendentes.length} subtitle="Ação necessária" icon={<Clock className="text-amber-600" size={24} />} accent="bg-amber-500" highlight={notasPendentes.length > 0}/>
                                        <StatCard title="Última Movimentação" value={notas.length > 0 ? formatData(notas[0].dataLancamento) : '--/--/----'} subtitle="Mais recente" icon={<Calendar className="text-blue-600" size={24} />} accent="bg-blue-500"/>
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                        <div className="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200">
                                            <div className="px-6 py-5 border-b border-slate-100 flex justify-between items-center">
                                                <h3 className="text-lg font-semibold text-slate-800">Últimos Lançamentos</h3>
                                                <button onClick={() => setActiveTab('historico')} className="text-sm font-medium text-blue-600 hover:text-blue-800">Ver tudo</button>
                                            </div>
                                            <div className="p-0">
                                                {notas.length === 0 ? <EmptyState /> : (
                                                    <table className="w-full text-left border-collapse">
                                                        <thead>
                                                            <tr className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                                                                <th className="px-6 py-3 font-semibold">Documento</th><th className="px-6 py-3 font-semibold">Parceiro</th><th className="px-6 py-3 font-semibold text-right">Valor</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-slate-100">
                                                            {notas.slice(0, 5).map(nota => (
                                                                <tr key={nota.id} className="hover:bg-slate-50 transition-colors">
                                                                    <td className="px-6 py-3"><div className="font-medium text-slate-800">{nota.numero}</div><div className="text-xs text-slate-500">{formatData(nota.dataLancamento)}</div></td>
                                                                    <td className="px-6 py-3 text-sm text-slate-600">{nota.fornecedor || '-'}</td>
                                                                    <td className="px-6 py-3 font-medium text-slate-800 text-right">R$ {parseFloat(nota.valor).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                )}
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col">
                                            <div className="px-6 py-5 border-b border-slate-100"><h3 className="text-lg font-semibold text-slate-800 flex items-center gap-2"><Clock size={20} className="text-amber-500" /> Pendentes</h3></div>
                                            <div className="p-4 flex-1">
                                                {notasPendentes.length === 0 ? (
                                                    <div className="flex flex-col items-center justify-center py-8"><CheckCircle2 size={40} className="text-emerald-200 mb-3" /><p className="text-slate-500 text-sm">Tudo em dia!</p></div>
                                                ) : (
                                                    <div className="space-y-3">
                                                        {notasPendentes.slice(0, 5).map(nota => (
                                                            <div key={nota.id} className="bg-amber-50 border border-amber-100 rounded-lg p-3 flex justify-between items-center">
                                                                <div><div className="text-sm font-bold text-amber-900">NF {nota.numero}</div></div>
                                                                <button onClick={() => setActiveTab('historico')} className="text-xs font-medium bg-amber-200 text-amber-800 px-3 py-1.5 rounded transition-colors hover:bg-amber-300">Resolver</button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'lancar' && (
                                <div className="p-6 md:p-8 max-w-4xl mx-auto animate-fade-in"><div className="mb-6"><h2 className="text-2xl font-bold text-slate-800">Novo Documento</h2><p className="text-sm text-slate-500">Faça upload do XML para preencher automaticamente.</p></div><FormLancarNota onSave={salvarNota} /></div>
                            )}
                            {activeTab === 'lote' && (
                                <div className="p-6 md:p-8 max-w-5xl mx-auto animate-fade-in"><div className="mb-6"><h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2"><UploadCloud className="text-blue-600" />Lançamento em Massa</h2><p className="text-sm text-slate-500">Arraste múltiplos arquivos XML.</p></div><FormLancarLote onSave={salvarLote} /></div>
                            )}

                            {activeTab === 'historico' && (
                                <div className="p-6 md:p-8 max-w-[1400px] mx-auto animate-fade-in flex flex-col h-full">
                                    <div className="mb-6 space-y-4">
                                        <h2 className="text-2xl font-bold text-slate-800">Base de Notas</h2>
                                        <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col lg:flex-row gap-4 justify-between items-center">
                                            <div className="flex bg-slate-100 p-1 rounded-lg w-full lg:w-auto">
                                                <TabFilter active={filtroTipo === 'todas'} onClick={() => setFiltroTipo('todas')} label="Todas as Notas" />
                                                <TabFilter active={filtroTipo === 'venda'} onClick={() => setFiltroTipo('venda')} label="Vendas" />
                                                <TabFilter active={filtroTipo === 'amostra'} onClick={() => setFiltroTipo('amostra')} label="Amostras" />
                                            </div>
                                            <div className="flex flex-col md:flex-row gap-4 w-full lg:w-auto">
                                                <div className="relative"><select value={filtroMes} onChange={(e) => setFiltroMes(e.target.value)} className="appearance-none bg-white border border-slate-300 text-slate-700 text-sm rounded-lg focus:ring-blue-500 block w-full pl-10 pr-8 py-2.5 outline-none cursor-pointer"><option value="todos">Todos os Meses</option><option value="01">Janeiro</option><option value="02">Fevereiro</option><option value="03">Março</option><option value="04">Abril</option><option value="05">Maio</option><option value="06">Junho</option><option value="07">Julho</option><option value="08">Agosto</option><option value="09">Setembro</option><option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option></select><CalendarDays className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={16} /></div>
                                                <div className="relative"><select value={filtroStatus} onChange={(e) => setFiltroStatus(e.target.value)} className="appearance-none bg-white border border-slate-300 text-slate-700 text-sm rounded-lg focus:ring-blue-500 block w-full pl-10 pr-8 py-2.5 outline-none cursor-pointer"><option value="todos">Status</option><option value="pendente">Pendente</option><option value="lancada">Lançada</option></select><Filter className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={16} /></div>
                                                <div className="relative w-full md:w-80"><Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18} /><input type="text" placeholder="Procurar número ou parceiro..." className="w-full pl-10 pr-4 py-2.5 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} /></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 overflow-hidden flex flex-col">
                                        <div className="overflow-x-auto flex-1 h-full">
                                            <table className="w-full text-left border-collapse min-w-[900px]">
                                                <thead className="bg-slate-50 sticky top-0 z-10 shadow-sm outline outline-1 outline-slate-200"><tr className="text-slate-600 text-xs uppercase tracking-wider"><th className="px-6 py-4 font-semibold">Status</th><th className="px-6 py-4 font-semibold">Nº Documento</th><th className="px-6 py-4 font-semibold">Parceiro de Negócio</th><th className="px-6 py-4 font-semibold">Categoria</th><th className="px-6 py-4 font-semibold">Data Emissão</th><th className="px-6 py-4 font-semibold text-right">Valor Bruto</th><th className="px-6 py-4 font-semibold text-center">Anexo</th><th className="px-6 py-4 font-semibold text-right">Ações</th></tr></thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {notasFiltradas.length === 0 ? (
                                                        <tr><td colSpan="8" className="px-6 py-16 text-center text-slate-500"><AlertCircle size={40} className="mx-auto text-slate-300 mb-3" /><p className="text-lg font-medium text-slate-600">Nenhum registro encontrado.</p></td></tr>
                                                    ) : (
                                                        notasFiltradas.map(nota => (
                                                            <tr key={nota.id} className={`transition-colors group ${nota.status === 'pendente' ? 'bg-[#fffbeb] hover:bg-[#fef3c7]' : 'hover:bg-slate-50'}`}>
                                                                <td className="px-6 py-4"><BadgeStatus status={nota.status} onClick={() => alternarStatus(nota.id, nota.status)} /></td>
                                                                <td className="px-6 py-4 font-bold text-slate-800">{nota.numero}</td>
                                                                <td className="px-6 py-4 text-sm text-slate-700 font-medium">{nota.fornecedor || 'Não informado'}</td>
                                                                <td className="px-6 py-4"><BadgeTipo tipo={nota.tipo} /></td>
                                                                <td className="px-6 py-4 text-sm text-slate-500">{formatData(nota.dataLancamento)}</td>
                                                                <td className="px-6 py-4 font-bold text-slate-800 text-right">R$ {parseFloat(nota.valor).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
                                                                <td className="px-6 py-4 text-center">{nota.arquivoNome ? (<button className="p-2 rounded-lg text-blue-600 hover:bg-blue-50" title={nota.arquivoNome}><Paperclip size={18} /></button>) : <span className="text-slate-300">-</span>}</td>
                                                                <td className="px-6 py-4 text-right"><button onClick={() => deletarNota(nota.id)} className="text-slate-400 hover:text-red-600 p-2 rounded-lg hover:bg-red-50"><Trash2 size={18} /></button></td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                        <div className="bg-slate-50 border-t border-slate-200 px-6 py-3 text-sm text-slate-600 flex justify-between shrink-0">
                                            <span>Mostrando <strong>{notasFiltradas.length}</strong> registros</span>
                                            <span>Total Filtrado: <strong>R$ {notasFiltradas.reduce((acc, nota) => acc + parseFloat(nota.valor || 0), 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</strong></span>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        const extrairDadosDeArquivo = async (file) => {
            return new Promise((resolve) => {
                if (file.type !== 'text/xml' && !file.name.toLowerCase().endsWith('.xml')) {
                    resolve({ numero: '', fornecedor: '', dataLancamento: new Date().toISOString().split('T')[0], valor: '' }); return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result; const xmlDoc = new DOMParser().parseFromString(text, "text/xml");
                    const getText = (tagName) => xmlDoc.getElementsByTagName(tagName)[0]?.textContent || '';
                    const emit = xmlDoc.getElementsByTagName('emit')[0];
                    let dataEmi = getText('dhEmi') || getText('dEmi');
                    resolve({
                        numero: getText('nNF'),
                        fornecedor: emit ? (emit.getElementsByTagName('xNome')[0]?.textContent || '') : '',
                        dataLancamento: dataEmi ? dataEmi.split('T')[0] : new Date().toISOString().split('T')[0],
                        valor: getText('vNF') ? parseFloat(getText('vNF')).toFixed(2) : ''
                    });
                };
                reader.readAsText(file);
            });
        };

        function FormLancarNota({ onSave }) {
            const [f, setF] = useState({ numero: '', fornecedor: '', dataLancamento: new Date().toISOString().split('T')[0], valor: '', tipo: 'venda', status: 'pendente' });
            const [arquivo, setArquivo] = useState(null); const [lendo, setLendo] = useState(false);
            const handleChange = async (e) => {
                const file = e.target.files[0]; if(!file) return; setArquivo(file); setLendo(true);
                const d = await extrairDadosDeArquivo(file);
                if(d.numero || d.valor) setF(p => ({...p, numero: d.numero||p.numero, fornecedor: d.fornecedor||p.fornecedor, dataLancamento: d.dataLancamento||p.dataLancamento, valor: d.valor||p.valor}));
                setLendo(false);
            };
            return (
                <form onSubmit={(e) => { e.preventDefault(); onSave({ id: crypto.randomUUID(), ...f, arquivoNome: arquivo?.name, dataUpload: new Date().toISOString() }); setF({ numero: '', fornecedor: '', dataLancamento: new Date().toISOString().split('T')[0], valor: '', tipo: 'venda', status: 'pendente' }); setArquivo(null); }} className="bg-white p-8 rounded-xl shadow-sm border border-slate-200">
                    <div className="mb-8 p-6 bg-blue-50 border border-blue-100 rounded-xl">
                        <label className="text-sm font-bold text-blue-900 flex items-center gap-2 mb-2"><UploadCloud size={18}/> Passo 1: Anexe o XML</label>
                        <div className="border-2 border-dashed border-blue-300 rounded-xl p-8 text-center bg-white relative">
                            <input type="file" accept=".xml,.pdf" className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onChange={handleChange} />
                            <div className="flex flex-col items-center pointer-events-none">
                                <div className={`bg-blue-100 p-3 rounded-full mb-3 ${lendo ? 'animate-bounce' : ''}`}>{lendo ? <Clock className="text-blue-600 animate-spin" /> : <FilePlus className="text-blue-600" />}</div>
                                <div><p className="font-bold text-slate-700">{arquivo ? arquivo.name : 'Arraste o arquivo XML'}</p></div>
                            </div>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="md:col-span-2 flex gap-6 p-4 bg-slate-50 rounded-xl border">
                            <label className="flex items-center gap-2 cursor-pointer"><input type="radio" value="venda" checked={f.tipo === 'venda'} onChange={e => setF({...f, tipo: e.target.value})} /> Venda</label>
                            <label className="flex items-center gap-2 cursor-pointer"><input type="radio" value="amostra" checked={f.tipo === 'amostra'} onChange={e => setF({...f, tipo: e.target.value})} /> Amostra</label>
                        </div>
                        <div className="space-y-2"><label className="text-sm font-semibold">Número *</label><input required className="w-full border p-2.5 rounded-lg" value={f.numero} onChange={e => setF({...f, numero: e.target.value})} /></div>
                        <div className="space-y-2"><label className="text-sm font-semibold">Fornecedor</label><input className="w-full border p-2.5 rounded-lg" value={f.fornecedor} onChange={e => setF({...f, fornecedor: e.target.value})} /></div>
                        <div className="space-y-2"><label className="text-sm font-semibold">Data *</label><input type="date" required className="w-full border p-2.5 rounded-lg" value={f.dataLancamento} onChange={e => setF({...f, dataLancamento: e.target.value})} /></div>
                        <div className="space-y-2"><label className="text-sm font-semibold">Valor R$ *</label><input type="number" step="0.01" required className="w-full border p-2.5 rounded-lg" value={f.valor} onChange={e => setF({...f, valor: e.target.value})} /></div>
                    </div>
                    <button type="submit" className="mt-8 bg-blue-600 text-white px-8 py-2.5 rounded-lg font-bold w-full md:w-auto">Salvar na Nuvem</button>
                </form>
            );
        }

        function FormLancarLote({ onSave }) {
            const [lote, setLote] = useState([]); const [proc, setProc] = useState(false);
            const handleChange = async (e) => {
                setProc(true); const files = Array.from(e.target.files);
                const novas = await Promise.all(files.map(async (file) => {
                    const d = await extrairDadosDeArquivo(file);
                    return { id: crypto.randomUUID(), numero: d.numero || '?', fornecedor: d.fornecedor || '?', dataLancamento: d.dataLancamento, valor: d.valor || '0', tipo: 'venda', status: 'pendente', arquivoNome: file.name, dataUpload: new Date().toISOString() };
                }));
                setLote(p => [...p, ...novas]); setProc(false);
            };
            return (
                <div className="bg-white p-8 rounded-xl shadow-sm border border-slate-200">
                    <div className="border-2 border-dashed border-blue-300 rounded-xl p-10 text-center bg-slate-50 mb-8 relative">
                        <input type="file" multiple accept=".xml" className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onChange={handleChange} />
                        <UploadCloud className={`mx-auto mb-4 text-blue-500 ${proc ? 'animate-bounce' : ''}`} size={40} />
                        <p className="font-bold">Arraste múltiplos XMLs aqui</p>
                    </div>
                    {lote.length > 0 && (
                        <div className="border rounded-xl overflow-hidden">
                            <div className="bg-slate-50 p-3 border-b flex justify-between font-bold">Lote ({lote.length})</div>
                            <table className="w-full text-sm text-left"><tbody className="divide-y">{lote.map(n => <tr key={n.id}><td className="p-3">{n.arquivoNome}</td><td className="p-3 font-bold">{n.numero}</td><td className="p-3 text-right"><button onClick={() => setLote(lote.filter(x => x.id !== n.id))} className="text-red-500"><Trash2 size={16}/></button></td></tr>)}</tbody></table>
                            <button onClick={() => { onSave(lote); setLote([]); }} className="w-full bg-emerald-600 text-white p-4 font-bold flex justify-center gap-2"><Check size={20}/> Salvar Lote na Nuvem</button>
                        </div>
                    )}
                </div>
            );
        }

        function MenuButton({ active, onClick, icon, label, badge }) { return <button onClick={onClick} className={`w-full flex justify-between p-3 rounded-xl font-medium ${active ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'}`}><div className="flex gap-3">{icon}{label}</div>{badge && <span className="bg-amber-500 text-white text-[10px] px-2 py-0.5 rounded-full">{badge}</span>}</button>; }
        function StatCard({ title, value, subtitle, icon, accent, highlight }) { return <div className={`bg-white rounded-xl p-5 border relative overflow-hidden ${highlight ? 'ring-2 ring-amber-400' : ''}`}><div className={`absolute top-0 left-0 w-1 h-full ${accent}`}></div><div className="flex justify-between"><div><p className="text-slate-500 text-sm mb-1">{title}</p><h3 className="text-2xl font-bold">{value}</h3><p className="text-xs text-slate-400 mt-2">{subtitle}</p></div><div className="bg-slate-50 p-3 rounded-lg">{icon}</div></div></div>; }
        function TabFilter({ active, onClick, label }) { return <button onClick={onClick} className={`px-4 py-2 text-sm rounded-md flex-1 ${active ? 'bg-white text-blue-700 shadow-sm font-bold' : 'text-slate-500'}`}>{label}</button>; }
        function BadgeStatus({ status, onClick }) { const isP = status === 'pendente'; return <button onClick={onClick} className={`flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold uppercase border ${isP ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>{isP ? <Clock size={12} /> : <CheckCircle2 size={12} />}{isP ? 'Pendente' : 'Lançada'}</button>; }
        function BadgeTipo({ tipo }) { const isA = tipo === 'amostra'; return <span className={`flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-bold border ${isA ? 'bg-purple-50 text-purple-700' : 'bg-blue-50 text-blue-700'}`}>{isA ? <Package size={12}/> : <TrendingUp size={12}/>}{isA ? 'Amostra' : 'Venda'}</span>; }
        function EmptyState() { return <div className="text-center py-12 text-slate-400"><AlertCircle size={40} className="mx-auto mb-3 opacity-30" /><p>Nenhuma nota.</p></div>; }
        function formatData(s) { if(!s) return '-'; const p = s.split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
