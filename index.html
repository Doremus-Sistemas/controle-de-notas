<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Notas Fiscais - Doremus</title>
    
    <!-- Framework Visual (Tailwind CSS) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Biblioteca de Leitura de PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        window.pdfjsLib = window['pdfjs-dist/build/pdf'];
        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }
    </script>

    <!-- Compilador React -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Módulos Externos -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0",
            "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
            "firebase/database": "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js"
        }
    }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            background-color: #f8fafc; 
            overflow: hidden; 
            font-family: 'Inter', sans-serif;
            color: #0f172a;
        }
        #root { height: 100%; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sidebar-active {
            background-color: #eff6ff;
            color: #2563eb;
            font-weight: 600;
        }
        .sidebar-active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background-color: #2563eb;
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
        }
        
        .input-premium {
            width: 100%;
            border: 1px solid #e2e8f0;
            padding: 0.625rem 0.875rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            color: #1e293b;
            background-color: #fff;
            outline: none;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        .input-premium:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        
        .label-premium {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.375rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Plus, List, LayoutDashboard, Upload, Trash2, Search, Paperclip,
            TrendingUp, Calendar, AlertCircle, Clock, Package, CheckCircle2,
            Filter, CalendarDays, Menu, X, FilePlus, UploadCloud, Check, Save,
            ArrowRight, RefreshCw, FileText, Briefcase, Pencil, XCircle, User,
            ChevronRight, Cloud, Settings
        } from 'lucide-react';
        
        import { initializeApp } from 'firebase/app';
        import { getDatabase, ref, onValue, set, remove, update, get } from 'firebase/database';

        const firebaseConfig = {
            apiKey: "AIzaSyBLtWbeKw9gWD1kPd8DL_r5gG2FQ1PJBC8",
            authDomain: "sistemanotas-523ac.firebaseapp.com",
            databaseURL: "https://sistemanotas-523ac-default-rtdb.firebaseio.com",
            projectId: "sistemanotas-523ac",
            storageBucket: "sistemanotas-523ac.firebasestorage.app",
            messagingSenderId: "120014924067",
            appId: "1:120014924067:web:01030e38cd66f9b9de4496",
            measurementId: "G-XBMC5RPQ0N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const gerarID = () => Date.now().toString(36) + Math.random().toString(36).substr(2, 5);

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [searchTerm, setSearchTerm] = useState('');
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [previewNota, setPreviewNota] = useState(null); 
            const [editingNota, setEditingNota] = useState(null); 
            const [notas, setNotas] = useState([]);
            const [carregando, setCarregando] = useState(true);
            const [erroConexao, setErroConexao] = useState(false);
            
            const [filtroStatus, setFiltroStatus] = useState('todos');
            const [filtroMes, setFiltroMes] = useState('todos');
            const [filtroClassificacao, setFiltroClassificacao] = useState('todas');

            useEffect(() => {
                const notasRef = ref(db, 'notasFiscais');
                const unsubscribe = onValue(notasRef, (snapshot) => {
                    const data = snapshot.val();
                    const notasArray = data ? Object.keys(data).map(key => ({ id: key, classificacao: 'padrao', ...data[key] })) : [];
                    notasArray.sort((a, b) => new Date(b.dataUpload || 0) - new Date(a.dataUpload || 0));
                    setNotas(notasArray);
                    setCarregando(false);
                    setErroConexao(false);
                }, (err) => {
                    setErroConexao(true);
                    setCarregando(false);
                });
                return () => unsubscribe();
            }, []);

            const salvarNota = async (novaNota) => {
                try {
                    const id = novaNota.id || gerarID();
                    const base64 = novaNota.arquivoDataUrl;
                    const dadosLista = { ...novaNota, id };
                    delete dadosLista.arquivoDataUrl;

                    await set(ref(db, 'notasFiscais/' + id), dadosLista);
                    if (base64) await set(ref(db, 'arquivos/' + id), base64);
                    setActiveTab('historico');
                } catch (e) { alert("Erro de sincronização com a base de dados."); }
            };

            const salvarEdicao = async (e) => {
                e.preventDefault();
                try {
                    const { id, valor, dataLancamento, numero, fornecedor, status } = editingNota;
                    await update(ref(db, 'notasFiscais/' + id), { valor, dataLancamento, numero, fornecedor, status });
                    setEditingNota(null);
                } catch (e) { alert("Erro ao atualizar dados."); }
            };

            const salvarLote = async (lote) => {
                setCarregando(true);
                for (const n of lote) await salvarNota(n);
                setCarregando(false);
            };

            const deletarNota = async (id) => {
                if(window.confirm('Tem a certeza que pretende excluir este registo permanentemente?')) {
                    await remove(ref(db, 'notasFiscais/' + id));
                    await remove(ref(db, 'arquivos/' + id));
                }
            };

            const alternarStatus = async (id, statusAtual) => {
                let novoStatus = 'pendente';
                if (statusAtual === 'pendente') novoStatus = 'aguardando_amostra';
                else if (statusAtual === 'aguardando_amostra') novoStatus = 'lancada';
                else novoStatus = 'pendente';
                
                await update(ref(db, 'notasFiscais/' + id), { status: novoStatus });
            };

            const marcarLancada = async (id) => {
                await update(ref(db, 'notasFiscais/' + id), { status: 'lancada' });
            };

            // Função para atualizar diretamente o dropdown na tabela
            const atualizarClassificacao = async (id, novaClassificacao) => {
                await update(ref(db, 'notasFiscais/' + id), { classificacao: novaClassificacao });
            };

            const abrirVisualizacao = async (nota) => {
                setPreviewNota({ ...nota, carregandoAnexo: true });
                try {
                    const snap = await get(ref(db, 'arquivos/' + nota.id));
                    if (snap.exists()) {
                        setPreviewNota({ ...nota, arquivoDataUrl: snap.val(), carregandoAnexo: false });
                    } else {
                        alert("Arquivo indisponível. Talvez esta nota tenha sido lançada sem anexo.");
                        setPreviewNota(null);
                    }
                } catch (e) { setPreviewNota(null); }
            };

            const notasFiltradas = notas.filter(n => {
                const matchBusca = n.numero?.includes(searchTerm) || (n.fornecedor && n.fornecedor.toLowerCase().includes(searchTerm.toLowerCase()));
                const matchStatus = filtroStatus === 'todos' || n.status === filtroStatus;
                const matchClass = filtroClassificacao === 'todas' || (n.classificacao || 'padrao') === filtroClassificacao;
                const mesNota = n.dataLancamento ? n.dataLancamento.split('-')[1] : null;
                const matchMes = filtroMes === 'todos' || mesNota === filtroMes;
                return matchBusca && matchStatus && matchMes && matchClass;
            });

            const notasAgrupadas = notasFiltradas.reduce((acc, nota) => {
                const data = nota.dataLancamento || 'Sem Data';
                if (!acc[data]) acc[data] = [];
                acc[data].push(nota);
                return acc;
            }, {});
            
            const datasOrdenadas = Object.keys(notasAgrupadas).sort((a, b) => new Date(b) - new Date(a));

            const totalGeral = notas.reduce((acc, n) => acc + parseFloat(n.valor || 0), 0);
            const pendentes = notas.filter(n => n.status !== 'lancada').length;

            return (
                <div className="flex h-screen bg-slate-50 overflow-hidden text-slate-800">
                    
                    {/* MODAL DE EDIÇÃO */}
                    {editingNota && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 animate-fade-in">
                            <form onSubmit={salvarEdicao} className="bg-white rounded-xl w-full max-w-lg shadow-2xl overflow-hidden border border-slate-200">
                                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                                    <h3 className="font-semibold text-slate-800 flex items-center gap-2">
                                        <Pencil size={18} className="text-blue-600"/> Editar Registo
                                    </h3>
                                    <button type="button" onClick={() => setEditingNota(null)} className="p-1.5 hover:bg-slate-100 rounded-md text-slate-400 transition-colors"><X size={18}/></button>
                                </div>
                                <div className="p-6 space-y-5">
                                    <div className="grid grid-cols-2 gap-5">
                                        <div>
                                            <label className="label-premium">Nº Nota</label>
                                            <input required className="input-premium" value={editingNota.numero} onChange={e => setEditingNota({...editingNota, numero: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="label-premium">Data Lançamento</label>
                                            <input type="date" required className="input-premium" value={editingNota.dataLancamento} onChange={e => setEditingNota({...editingNota, dataLancamento: e.target.value})} />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="label-premium">Parceiro / Fornecedor</label>
                                        <input required className="input-premium" value={editingNota.fornecedor} onChange={e => setEditingNota({...editingNota, fornecedor: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-5">
                                        <div>
                                            <label className="label-premium">Valor Bruto (R$)</label>
                                            <input type="number" step="0.01" required className="input-premium" value={editingNota.valor} onChange={e => setEditingNota({...editingNota, valor: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="label-premium">Status</label>
                                            <select className="input-premium cursor-pointer" value={editingNota.status} onChange={e => setEditingNota({...editingNota, status: e.target.value})}>
                                                <option value="pendente">Pendente</option>
                                                <option value="aguardando_amostra">Aguard. Amostra</option>
                                                <option value="lancada">Lançada</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div className="p-5 bg-slate-50 border-t border-slate-100 flex gap-3 justify-end">
                                    <button type="button" onClick={() => setEditingNota(null)} className="px-5 py-2 text-sm font-medium text-slate-600 hover:bg-slate-200 bg-slate-100 rounded-lg transition-colors">Cancelar</button>
                                    <button type="submit" className="px-5 py-2 text-sm font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-sm transition-colors flex items-center gap-2">
                                        Gravar Alterações
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* MODAL DE VISUALIZAÇÃO PDF */}
                    {previewNota && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 sm:p-8 animate-fade-in">
                            <div className="bg-white rounded-xl w-full max-w-5xl h-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden border border-slate-200">
                                <div className="flex justify-between items-center px-6 py-4 border-b border-slate-100">
                                    <div className="flex items-center gap-3">
                                        <div className="p-2 bg-blue-50 text-blue-600 rounded-lg"><FileText size={20}/></div>
                                        <div>
                                            <h3 className="text-sm font-semibold text-slate-800">{previewNota.arquivoNome}</h3>
                                            <p className="text-xs text-slate-500 mt-0.5">Data: {formatData(previewNota.dataLancamento)} • Doc Nº {previewNota.numero}</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setPreviewNota(null)} className="p-2 hover:bg-slate-100 text-slate-500 hover:text-slate-700 rounded-lg transition-all"><X size={20}/></button>
                                </div>
                                <div className="flex-1 bg-slate-100/50 p-4 sm:p-6 overflow-hidden flex items-center justify-center">
                                    {previewNota.carregandoAnexo ? (
                                        <div className="flex flex-col items-center gap-3">
                                            <RefreshCw className="animate-spin text-blue-600" size={28}/>
                                            <span className="text-sm font-medium text-slate-500">A obter documento da Cloud...</span>
                                        </div>
                                    ) : <iframe src={previewNota.arquivoDataUrl} className="w-full h-full rounded-lg border border-slate-200 bg-white shadow-sm"></iframe>}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SIDEBAR PROFISSIONAL */}
                    <aside className={`bg-white border-r border-slate-200 flex flex-col transition-all duration-300 shadow-[2px_0_8px_rgba(0,0,0,0.02)] ${isSidebarOpen ? 'w-64' : 'w-0 -translate-x-full md:translate-x-0 md:w-20'} z-50 overflow-hidden shrink-0`}>
                        <div className="h-16 flex items-center gap-3 px-6 border-b border-slate-100 shrink-0">
                            <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white shrink-0 shadow-sm shadow-blue-200">
                                <Briefcase size={18} strokeWidth={2.5}/>
                            </div>
                            <span className={`font-bold text-slate-800 text-sm whitespace-nowrap transition-opacity duration-200 ${!isSidebarOpen && 'opacity-0 hidden'}`}>Doremus Notas</span>
                        </div>
                        
                        <nav className="flex-1 py-4 overflow-y-auto overflow-x-hidden space-y-1">
                            <div className={`px-6 mt-2 mb-2 text-xs font-semibold text-slate-400 ${!isSidebarOpen && 'hidden'}`}>Visão Geral</div>
                            <SidebarItem active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} icon={<LayoutDashboard size={18}/>} label="Dashboard" expanded={isSidebarOpen} />
                            
                            <div className={`px-6 mt-6 mb-2 text-xs font-semibold text-slate-400 ${!isSidebarOpen && 'hidden'}`}>Gestão</div>
                            <SidebarItem active={activeTab === 'lancar'} onClick={() => setActiveTab('lancar')} icon={<FilePlus size={18}/>} label="Novo Registo" expanded={isSidebarOpen} />
                            <SidebarItem active={activeTab === 'lote'} onClick={() => setActiveTab('lote')} icon={<UploadCloud size={18}/>} label="Importação em Lote" expanded={isSidebarOpen} />
                            <SidebarItem active={activeTab === 'historico'} onClick={() => setActiveTab('historico')} icon={<List size={18}/>} label="Base de Dados" expanded={isSidebarOpen} badge={pendentes} />
                        </nav>

                        {/* STATUS DO USUÁRIO/SISTEMA */}
                        <div className="p-4 border-t border-slate-100 bg-slate-50/50">
                            <div className={`flex items-center gap-3 ${!isSidebarOpen && 'justify-center'}`}>
                                <div className="w-9 h-9 rounded-full bg-blue-100 border border-blue-200 flex items-center justify-center text-blue-700 shrink-0">
                                    <User size={18} />
                                </div>
                                <div className={`flex flex-col overflow-hidden ${!isSidebarOpen && 'hidden'}`}>
                                    <span className="text-sm font-semibold text-slate-800 truncate">Administrador</span>
                                    <span className="text-[11px] text-emerald-600 font-medium flex items-center gap-1">
                                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Online
                                    </span>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* CONTEÚDO PRINCIPAL */}
                    <div className="flex-1 flex flex-col h-full relative overflow-hidden min-w-0">
                        <header className="bg-white border-b border-slate-200 h-16 px-6 flex items-center justify-between shrink-0 z-40">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-2 text-slate-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors border border-transparent">
                                    <Menu size={20}/>
                                </button>
                                <div className="h-6 w-px bg-slate-200 hidden md:block"></div>
                                <div className="hidden sm:flex items-center gap-2 text-sm font-medium text-slate-500">
                                    <span>Gestão de Notas</span>
                                    <ChevronRight size={14} className="text-slate-300"/>
                                    <span className="text-slate-800 capitalize">{activeTab === 'historico' ? 'Base de Dados' : activeTab.replace('-', ' ')}</span>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-2">
                                <div className={`flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium border ${carregando ? 'bg-blue-50 border-blue-100 text-blue-600' : 'bg-emerald-50 border-emerald-100 text-emerald-600'}`}>
                                    {carregando ? <RefreshCw size={14} className="animate-spin"/> : <Cloud size={14}/>}
                                    <span className="hidden sm:inline">{carregando ? 'Sincronizando...' : 'Cloud Conectada'}</span>
                                </div>
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto p-6 md:p-8">
                            <div className="max-w-7xl mx-auto space-y-8">
                                
                                {/* ----------------------- TAB: DASHBOARD ----------------------- */}
                                {activeTab === 'dashboard' && (
                                    <div className="space-y-6 animate-fade-in">
                                        
                                        {/* Cabeçalho do Dashboard */}
                                        <div className="bg-gradient-to-br from-blue-700 to-indigo-800 rounded-2xl p-8 text-white shadow-lg flex flex-col md:flex-row justify-between items-center gap-6">
                                            <div>
                                                <h2 className="text-3xl font-bold mb-2 tracking-tight">Painel de Controle</h2>
                                                <p className="text-blue-100/80 text-sm font-medium">Acompanhamento e gestão de processamento em tempo real.</p>
                                            </div>
                                            <div className="bg-white/10 p-5 rounded-xl backdrop-blur-md border border-white/10 text-center min-w-[220px]">
                                                <p className="text-blue-200 text-xs font-semibold uppercase tracking-widest mb-1">Total Processado</p>
                                                <p className="text-3xl font-bold tracking-tight">R$ {totalGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                                            </div>
                                        </div>

                                        {/* Cartões KPI */}
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-5 hover:border-emerald-200 transition-colors">
                                                <div className="w-14 h-14 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0 border border-emerald-100"><CheckCircle2 size={26}/></div>
                                                <div>
                                                    <p className="text-sm text-slate-500 font-semibold mb-0.5">Notas Lançadas</p>
                                                    <p className="text-2xl font-bold text-slate-800">{notas.filter(n => n.status === 'lancada').length}</p>
                                                </div>
                                            </div>
                                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-5 hover:border-amber-200 transition-colors">
                                                <div className="w-14 h-14 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center shrink-0 border border-amber-100"><Clock size={26}/></div>
                                                <div>
                                                    <p className="text-sm text-slate-500 font-semibold mb-0.5">Ações Pendentes</p>
                                                    <p className="text-2xl font-bold text-slate-800">{pendentes}</p>
                                                </div>
                                            </div>
                                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-5 hover:border-blue-200 transition-colors">
                                                <div className="w-14 h-14 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center shrink-0 border border-blue-100"><FileText size={26}/></div>
                                                <div>
                                                    <p className="text-sm text-slate-500 font-semibold mb-0.5">Total de Registos</p>
                                                    <p className="text-2xl font-bold text-slate-800">{notas.length}</p>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Layout em 2 Colunas */}
                                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                            {/* Atividade Recente */}
                                            <div className="lg:col-span-2 bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col">
                                                <div className="p-6 border-b border-slate-100 flex justify-between items-center">
                                                    <h3 className="font-bold text-slate-800">Atividade Recente</h3>
                                                    <button onClick={() => setActiveTab('historico')} className="text-sm text-blue-600 font-semibold hover:text-blue-700 flex items-center gap-1">Ver Tabela <ArrowRight size={14}/></button>
                                                </div>
                                                <div className="flex-1 p-0">
                                                    <div className="divide-y divide-slate-100">
                                                        {notas.slice(0, 5).map(n => (
                                                            <div key={n.id} className="p-4 px-6 flex items-center justify-between hover:bg-slate-50 transition-colors">
                                                                <div className="flex items-center gap-4">
                                                                    <div className="w-10 h-10 rounded-lg bg-slate-100 border border-slate-200 text-slate-500 flex items-center justify-center">
                                                                        <FileText size={18}/>
                                                                    </div>
                                                                    <div>
                                                                        <p className="font-semibold text-slate-800">Fatura #{n.numero || 'N/D'}</p>
                                                                        <p className="text-xs font-medium text-slate-500">{n.fornecedor || 'Fornecedor não identificado'} • {formatData(n.dataLancamento)}</p>
                                                                    </div>

        // --- COMPONENTES AUXILIARES ---

        const extrairDados = async (file) => {
            const dataHoje = new Date().toISOString().split('T')[0];
            
            if (file.name.toLowerCase().endsWith('.pdf')) {
                try {
                    const ab = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument({ data: ab }).promise;
                    let text = '';
                    for (let i = 1; i <= Math.min(pdf.numPages, 2); i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        text += content.items.map(it => it.str).join(' ') + ' ';
                    }
                    const valorM = text.match(/R\$\s*([\d\.]+,\d{2})/i) || text.match(/Valor.*?([\d\.]+,\d{2})/i);
                    
                    // Regex avançado para capturar número, ignorando N, espaços e zeros à esquerda
                    const numM = text.match(/(?:NF|N[oó]ta|Nº|N)\s*[:.-]?\s*0*(\d+)/i);
                    let numLimpo = '';
                    if (numM) {
                        numLimpo = numM[1]; // O grupo (\d+) já pega sem os zeros iniciais se `0*` casar antes
                    } else {
                        // Tentar achar qualquer sequência numérica isolada como fallback
                        const fallbackM = text.match(/(?:N\s+)?0*(\d{4,})/i);
                        if(fallbackM) numLimpo = fallbackM[1];
                    }
                    
                    let emitente = '';
                    const emitMatch = text.match(/(?:IDENTIFICA[CÇ][AÃ]O DO EMITENTE|NOME\/RAZ[AÃ]O SOCIAL|RAZ[AÃ]O SOCIAL)[:\s]+([A-ZÀ-Ú0-9\s\.\&\-]{5,60})/i);
                    if (emitMatch) emitente = emitMatch[1].trim();

                    let isAmostra = false;
                    if (text.toLowerCase().includes('amostra') || text.toLowerCase().includes('brinde')) {
                        isAmostra = true;
                    }

                    return {
                        numero: numLimpo,
                        fornecedor: emitente,
                        dataLancamento: dataHoje, // Sempre força a data de hoje
                        valor: valorM ? valorM[1].replace(/\./g, '').replace(',', '.') : '',
                        isAmostra: isAmostra,
                        classificacao: 'padrao'
                    };
                } catch(e) { return { numero: '', fornecedor: '', dataLancamento: dataHoje, valor: '', isAmostra: false, classificacao: 'padrao' }; }
            } else {
                const text = await file.text();
                const xml = new DOMParser().parseFromString(text, "text/xml");
                const get = t => xml.getElementsByTagName(t)[0]?.textContent || '';
                
                const natOp = get('natOp').toLowerCase();
                const isAmostra = natOp.includes('amostra') || natOp.includes('brinde');

                let numeroXml = get('nNF') || get('Numero') || get('NfseNumero') || '';
                numeroXml = numeroXml.replace(/^0+/, ''); // Remove zeros à esquerda no XML também

                return {
                    numero: numeroXml,
                    fornecedor: xml.getElementsByTagName('emit')[0]?.getElementsByTagName('xNome')[0]?.textContent || get('RazaoSocial') || '',
                    dataLancamento: dataHoje, // Sempre força a data de hoje
                    valor: get('vNF') || get('ValorServicos') || get('ValorLiquidoNfse') || '',
                    isAmostra: isAmostra,
                    classificacao: 'padrao'
                };
            }
        };

        function FormIndividual({ onSave }) {
            const dataHoje = new Date().toISOString().split('T')[0];
            const [f, setF] = useState({ numero: '', fornecedor: '', dataLancamento: dataHoje, valor: '', status: 'pendente', classificacao: 'padrao' });
            const [arq, setArq] = useState(null);
            const [lendo, setLendo] = useState(false);

            const handleFile = async (e) => {
                const file = e.target.files[0]; if(!file) return; setLendo(true);
                const d = await extrairDados(file); 
                setF(p => ({...p, ...d, status: d.isAmostra ? 'aguardando_amostra' : 'pendente'}));
                const reader = new FileReader(); reader.onload = (ev) => { setArq({ name: file.name, data: ev.target.result }); setLendo(false); };
                reader.readAsDataURL(file);
            };

            return (
                <form onSubmit={e => { e.preventDefault(); onSave({...f, id: gerarID(), arquivoNome: arq?.name, arquivoDataUrl: arq?.data, dataUpload: new Date().toISOString() }); setF({ numero: '', fornecedor: '', dataLancamento: dataHoje, valor: '', status: 'pendente', classificacao: 'padrao' }); setArq(null); }} className="bg-white p-6 md:p-8 rounded-xl border border-slate-200 shadow-sm space-y-8">
                    
                    <div className="border-2 border-dashed border-slate-200 rounded-xl p-8 bg-slate-50 text-center relative group hover:bg-blue-50/50 hover:border-blue-300 transition-all cursor-pointer">
                        <input type="file" accept=".xml,.pdf" className="absolute inset-0 opacity-0 cursor-pointer z-10" onChange={handleFile} />
                        <div className={`mx-auto w-12 h-12 bg-white rounded-full flex items-center justify-center text-blue-600 mb-3 shadow-sm transition-all group-hover:scale-110 ${lendo ? 'animate-pulse' : ''}`}>

                        </div>

                        </div>
                        <div className="md:col-span-2">
                            <label className="label-premium">Parceiro / Fornecedor</label>
                            <input className="input-premium" placeholder="Nome da empresa emissora" value={f.fornecedor} onChange={e => setF({...f, fornecedor: e.target.value})} />
                        </div>
                        <div>
                            <label className="label-premium">Valor Bruto (R$)</label>
                            <input type="number" step="0.01" required className="input-premium" placeholder="0.00" value={f.valor} onChange={e => setF({...f, valor: e.target.value})} />
                        </div>
                        <div>
                            <label className="label-premium">Status de Origem</label>
                            <select className="input-premium cursor-pointer" value={f.status} onChange={e => setF({...f, status: e.target.value})}>
                                <option value="pendente">Pendente</option>
                                <option value="aguardando_amostra">Aguard. Amostra</option>
                                <option value="lancada">Lançada</option>
                            </select>
                        </div>
                    </div>

                    <div className="pt-4 border-t border-slate-100 flex justify-end">
                        <button type="submit" className="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-blue-700 transition-colors shadow-sm flex items-center gap-2">
                            <Save size={18}/> Salvar Registo na Cloud
                        </button>
                    </div>
                </form>
            );
        }

        function FormLote({ onSave }) {
            const [l, setL] = useState([]); const [p, setP] = useState(false);
            const handleFiles = async (e) => {
                setP(true); const files = Array.from(e.target.files);
                const novas = await Promise.all(files.map(async file => {
                    const d = await extrairDados(file);
                    const b64 = await new Promise(res => { const r = new FileReader(); r.onload = ev => res(ev.target.result); r.readAsDataURL(file); });
                    const definedStatus = d.isAmostra ? 'aguardando_amostra' : 'pendente';
                    return { ...d, id: gerarID(), arquivoNome: file.name, arquivoDataUrl: b64, status: definedStatus, dataUpload: new Date().toISOString() };
                }));
                setL(prev => [...prev, ...novas]); setP(false);
            };
            return (
                <div className="space-y-6">
                    <div className="bg-white p-12 border-2 border-dashed border-slate-300 rounded-xl text-center relative group hover:border-blue-400 hover:bg-blue-50/50 transition-all cursor-pointer">
                        <input type="file" multiple accept=".xml,.pdf" className="absolute inset-0 opacity-0 cursor-pointer z-10" onChange={handleFiles} />
                        <div className={`mx-auto w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center text-blue-600 mb-4 transition-all group-hover:scale-110 ${p ? 'animate-pulse' : ''}`}>
                            <UploadCloud size={32} />
                        </div>
                        <p className="font-semibold text-lg text-slate-800">Clique ou arraste ficheiros para aqui</p>
                        <p className="text-slate-500 text-sm mt-1">Lê múltiplos XML e PDF atribuindo a data do dia e limpando números N/00</p>
                    </div>
                    
                    {l.length > 0 && (
                        <div className="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm animate-fade-in">
                            <div className="px-6 py-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                                <span className="font-semibold text-slate-800 text-sm">{l.length} Ficheiros processados</span>
                                <button onClick={() => setL([])} className="text-sm font-medium text-slate-500 hover:text-slate-800 transition-colors">Limpar fila</button>
                            </div>
                            <div className="max-h-80 overflow-y-auto">
                                <table className="w-full text-sm text-left">
                                    <tbody className="divide-y divide-slate-100">
                                        {l.map(x => (
                                            <tr key={x.id} className="hover:bg-slate-50">
                                                <td className="px-6 py-3 text-slate-600 font-medium truncate max-w-[200px]">{x.arquivoNome}</td>
                                                <td className="px-6 py-3 font-medium text-slate-800">#{x.numero || '---'}</td>
                                                <td className="px-6 py-3">
                                                    <span className={`px-2 py-1 rounded text-xs font-medium ${x.status === 'aguardando_amostra' ? 'bg-purple-100 text-purple-700' : 'bg-amber-100 text-amber-700'}`}>
                                                        {x.status === 'aguardando_amostra' ? 'Amostra' : 'Venda'}
                                                    </span>
                                                </td>
                                                <td className="px-6 py-3 text-right font-medium text-slate-800">R$ {parseFloat(x.valor || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                                                <td className="px-6 py-3 text-right">
                                                    <button onClick={() => setL(l.filter(it => it.id !== x.id))} className="text-slate-400 hover:text-red-500 p-1.5 rounded-md hover:bg-slate-100 transition-colors"><Trash2 size={16}/></button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            <div className="p-4 bg-slate-50 border-t border-slate-200">
                                <button onClick={() => { onSave(l); setL([]); }} className="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700 transition-colors shadow-sm">
                                    Confirmar Importação de {l.length} Registos
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function SidebarItem({ active, onClick, icon, label, expanded, badge }) {
            return (
                <div className="px-3">
                    <button onClick={onClick} className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg transition-all text-sm relative ${active ? 'sidebar-active bg-blue-50' : 'text-slate-600 hover:bg-slate-100 font-medium'}`}>
                        <div className="flex items-center gap-3">
                            <span className={active ? 'text-blue-600' : 'text-slate-400'}>{icon}</span> 
                            <span className={!expanded ? 'hidden' : ''}>{label}</span>
                        </div>
                        {badge > 0 && expanded && <span className="bg-amber-100 text-amber-700 text-xs px-2 py-0.5 rounded-full font-bold">{badge}</span>}
                    </button>
                </div>
            );
        }
        
        function formatData(s) { if(!s) return '-'; const p = s.split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
