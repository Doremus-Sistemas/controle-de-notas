<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Plus, List, LayoutDashboard, Upload, Trash2, Search, Paperclip,
            TrendingUp, Calendar, AlertCircle, Clock, Package, CheckCircle2,
            Filter, CalendarDays, Menu, X, FilePlus, UploadCloud, Check, Save,
            ArrowRight, RefreshCw, FileText, Briefcase, Pencil, XCircle, User,
            ChevronRight, Cloud, Settings, Building2, Tag, ChevronDown, Mail, Copy, 
            CheckSquare, MessageSquare, AlertTriangle, ShieldCheck, ExternalLink, HelpCircle
        } from 'lucide-react';
        
        import { initializeApp } from 'firebase/app';
        import { getDatabase, ref, onValue, set, remove, update, get } from 'firebase/database';

        const firebaseConfig = {
            apiKey: "AIzaSyBLtWbeKw9gWD1kPd8DL_r5gG2FQ1PJBC8",
            authDomain: "sistemanotas-523ac.firebaseapp.com",
            databaseURL: "https://sistemanotas-523ac-default-rtdb.firebaseio.com",
            projectId: "sistemanotas-523ac",
            storageBucket: "sistemanotas-523ac.firebasestorage.app",
            messagingSenderId: "120014924067",
            appId: "1:120014924067:web:01030e38cd66f9b9de4496",
            measurementId: "G-XBMC5RPQ0N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const gerarID = () => Date.now().toString(36) + Math.random().toString(36).substring(2, 6);

        // Helper para formato monetário e datas
        const formatMoeda = (val) => {
            const num = parseFloat(val) || 0;
            return num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        const formatData = (s) => { 
            if (!s) return '-'; 
            const p = s.split('-'); 
            return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : s; 
        };

        const getStatusConfig = (status) => {
            switch(status) {
                case 'lancada': 
                    return { 
                        label: 'Lançada', 
                        class: 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100', 
                        dot: 'bg-emerald-500',
                        icon: <CheckCircle2 size={13}/> 
                    };
                case 'aguardando_amostra': 
                    return { 
                        label: 'Aguard. Amostra', 
                        class: 'bg-purple-50 text-purple-700 border-purple-200 hover:bg-purple-100', 
                        dot: 'bg-purple-500',
                        icon: <Package size={13}/> 
                    };
                case 'pendente': 
                default: 
                    return { 
                        label: 'Pendente', 
                        class: 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100', 
                        dot: 'bg-amber-500',
                        icon: <Clock size={13}/> 
                    };
            }
        };

        const getClassificacaoConfig = (classificacao) => {
            const padrao = classificacao || 'padrao';
            if (padrao === 'sem_cadastro') {
                return 'border-rose-200 bg-rose-50 text-rose-700 focus:ring-rose-500';
            }
            if (padrao === 'manutencao') {
                return 'border-amber-200 bg-amber-50 text-amber-700 focus:ring-amber-500';
            }
            return 'border-slate-200 bg-white text-slate-700 focus:ring-blue-500';
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [searchTerm, setSearchTerm] = useState('');
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [previewNota, setPreviewNota] = useState(null); 
            const [editingNota, setEditingNota] = useState(null); 
            const [notas, setNotas] = useState([]);
            const [carregando, setCarregando] = useState(true);
            const [erroConexao, setErroConexao] = useState(false);
            
            // Filtros da Base de Dados
            const [filtroStatus, setFiltroStatus] = useState('todos');
            const [filtroClassificacao, setFiltroClassificacao] = useState('todas');
            const [filtroJustificativa, setFiltroJustificativa] = useState('todas'); // todas, com_obs, sem_obs
            
            // Modais de ação
            const [modalAmostra, setModalAmostra] = useState(null);
            const [notaParaDeletar, setNotaParaDeletar] = useState(null);
            const [modalObservacao, setModalObservacao] = useState(null); // Justificativa de pendência
            
            // Seleção e E-mail
            const [notasSelecionadas, setNotasSelecionadas] = useState([]);
            const [modalEmailData, setModalEmailData] = useState(null);
            const [copiado, setCopiado] = useState(false);
            const [modoSelecao, setModoSelecao] = useState(false);
            const [incluirObsEmail, setIncluirObsEmail] = useState(false);

            // Sistema de Notificações Toast
            const [toast, setToast] = useState(null);
            const showToast = (mensagem, tipo = 'info') => {
                setToast({ mensagem, tipo });
                setTimeout(() => setToast(null), 3500);
            };

            useEffect(() => {
                const notasRef = ref(db, 'notasFiscais');
                const unsubscribe = onValue(notasRef, (snapshot) => {
                    const data = snapshot.val();
                    const notasArray = data ? Object.keys(data).map(key => ({ 
                        id: key, 
                        classificacao: 'padrao',
                        observacao: '',
                        ...data[key] 
                    })) : [];
                    notasArray.sort((a, b) => new Date(b.dataUpload || 0) - new Date(a.dataUpload || 0));
                    setNotas(notasArray);
                    setCarregando(false);
                    setErroConexao(false);
                }, (err) => {
                    console.error("Falha ao sincronizar com banco:", err);
                    setErroConexao(true);
                    setCarregando(false);
                    showToast("Erro na conexão com a base de dados.", "error");
                });
                return () => unsubscribe();
            }, []);

            const salvarNota = async (novaNota) => {
                try {
                    const id = novaNota.id || gerarID();
                    const base64 = novaNota.arquivoDataUrl;
                    const dadosLista = { ...novaNota, id };
                    delete dadosLista.arquivoDataUrl;

                    await set(ref(db, 'notasFiscais/' + id), dadosLista);
                    if (base64) await set(ref(db, 'arquivos/' + id), base64);
                    
                    showToast(`Nota Fiscal #${novaNota.numero || 'sem número'} cadastrada com sucesso!`, 'success');
                    setActiveTab('historico');
                } catch (e) {
                    showToast("Erro de sincronização ao salvar documento.", "error");
                }
            };

            const salvarEdicao = async (e) => {
                e.preventDefault();
                try {
                    const { id, valor, dataLancamento, numero, fornecedor, status, codigosAmostra, centroCusto, observacao } = editingNota;
                    await update(ref(db, 'notasFiscais/' + id), { 
                        valor, 
                        dataLancamento, 
                        numero, 
                        fornecedor, 
                        status, 
                        codigosAmostra: codigosAmostra || null,
                        centroCusto: centroCusto || null,
                        observacao: observacao || null
                    });
                    setEditingNota(null);
                    showToast("Dados da nota fiscal atualizados!", "success");
                } catch (e) { 
                    showToast("Erro ao atualizar dados.", "error");
                }
            };

            const salvarObservacaoRapida = async (e) => {
                e.preventDefault();
                if (!modalObservacao) return;
                try {
                    await update(ref(db, 'notasFiscais/' + modalObservacao.id), {
                        observacao: modalObservacao.textoObs || null
                    });
                    showToast("Observação / Justificativa gravada com sucesso!", "success");
                    setModalObservacao(null);
                } catch (err) {
                    showToast("Não foi possível salvar a observação.", "error");
                }
            };

            const salvarLote = async (lote) => {
                setCarregando(true);
                for (const n of lote) await salvarNota(n);
                setCarregando(false);
                showToast(`${lote.length} documento(s) importado(s) com êxito!`, 'success');
                setActiveTab('historico');
            };

            const deletarNota = (nota) => {
                setNotaParaDeletar(nota);
            };

            const confirmarDeletar = async (id) => {
                try {
                    await remove(ref(db, 'notasFiscais/' + id));
                    await remove(ref(db, 'arquivos/' + id));
                    setNotasSelecionadas(prev => prev.filter(nId => nId !== id));
                    setNotaParaDeletar(null);
                    showToast("Registo excluído permanentemente.", "info");
                } catch (e) {
                    showToast("Erro ao excluir registo.", "error");
                }
            };

            const alternarStatus = async (nota) => {
                let novoStatus = 'pendente';
                if (nota.status === 'pendente') novoStatus = 'aguardando_amostra';
                else if (nota.status === 'aguardando_amostra') novoStatus = 'lancada';
                else novoStatus = 'pendente';
                
                await update(ref(db, 'notasFiscais/' + nota.id), { status: novoStatus });

                if (novoStatus === 'aguardando_amostra') {
                    setModalAmostra({ 
                        ...nota, 
                        tempCode: nota.codigosAmostra || 'AM',
                        tempCentroCusto: nota.centroCusto || ''
                    });
                }
                showToast(`Status atualizado para: ${getStatusConfig(novoStatus).label}`, 'info');
            };

            const salvarDetalhesAmostra = async (e) => {
                e.preventDefault();
                try {
                    await update(ref(db, 'notasFiscais/' + modalAmostra.id), { 
                        codigosAmostra: modalAmostra.tempCode,
                        centroCusto: modalAmostra.tempCentroCusto
                    });
                    setModalAmostra(null);
                    showToast("Dados da amostra guardados!", "success");
                } catch (error) {
                    showToast("Erro ao gravar detalhes da amostra.", "error");
                }
            };

            const marcarLancada = async (id) => {
                await update(ref(db, 'notasFiscais/' + id), { status: 'lancada' });
                showToast("Nota marcada como lançada!", "success");
            };

            const atualizarClassificacao = async (id, novaClassificacao) => {
                await update(ref(db, 'notasFiscais/' + id), { classificacao: novaClassificacao });
            };

            const abrirVisualizacao = async (nota) => {
                setPreviewNota({ ...nota, carregandoAnexo: true });
                try {
                    const snap = await get(ref(db, 'arquivos/' + nota.id));
                    if (snap.exists()) {
                        setPreviewNota({ ...nota, arquivoDataUrl: snap.val(), carregandoAnexo: false });
                    } else {
                        showToast("Arquivo PDF/XML não localizado no armazenamento.", "error");
                        setPreviewNota(null);
                    }
                } catch (e) { 
                    showToast("Falha ao abrir visualização do arquivo.", "error");
                    setPreviewNota(null); 
                }
            };

            const handleSelectNota = (id) => {
                setNotasSelecionadas(prev => prev.includes(id) ? prev.filter(nId => nId !== id) : [...prev, id]);
            };

            const handleSelectAll = (e) => {
                if (e.target.checked) {
                    setNotasSelecionadas(notasFiltradas.map(n => n.id));
                } else {
                    setNotasSelecionadas([]);
                }
            };

            const toggleModoSelecao = () => {
                if (modoSelecao) {
                    setNotasSelecionadas([]);
                }
                setModoSelecao(!modoSelecao);
            };

            // Geração de e-mail com concordância gramatical precisa (singular / plural)
            const abrirModalEmail = () => {
                const hora = new Date().getHours();
                let saudacao = 'Bom dia';
                if (hora >= 12 && hora < 18) saudacao = 'Boa tarde';
                else if (hora >= 18) saudacao = 'Boa noite';

                const notasEmail = notasSelecionadas.map(id => notas.find(n => n.id === id)).filter(Boolean);
                if (notasEmail.length === 0) return;

                const isSingular = notasEmail.length === 1;
                const containsAmostras = notasEmail.some(n => n.status === 'aguardando_amostra' || n.codigosAmostra);

                let fraseAbertura = '';
                let assuntoSugerido = '';

                if (containsAmostras) {
                    if (isSingular) {
                        fraseAbertura = `Segue o dado para classificação da nota fiscal e seu respectivo centro de custo:`;
                        assuntoSugerido = `Classificação de Amostra - NF #${notasEmail[0].numero}`;
                    } else {
                        fraseAbertura = `Seguem os dados para classificação das notas e seus respectivos centros de custo:`;
                        assuntoSugerido = `Classificação de Amostras - (${notasEmail.length} Notas)`;
                    }
                } else {
                    if (isSingular) {
                        fraseAbertura = `O número da nota fiscal e o nome do fornecedor segue abaixo para classificação (arquivo em anexo):`;
                        assuntoSugerido = `Classificação de Nota Fiscal - NF #${notasEmail[0].numero}`;
                    } else {
                        fraseAbertura = `Os números das notas e os nomes dos fornecedores seguem abaixo para classificação (arquivos em anexo):`;
                        assuntoSugerido = `Classificação de Notas Fiscais - (${notasEmail.length} Faturas)`;
                    }
                }

                let tabelaHtml = '';
                if (containsAmostras) {
                    tabelaHtml = `
                        <table style="border-collapse: collapse; width: 100%; max-width: 680px; margin: 18px 0; font-size: 13px; font-family: Arial, sans-serif; border: 1px solid #cbd5e1;">
                            <thead>
                                <tr style="background-color: #1e3a8a; color: #ffffff;">
                                    <th style="padding: 10px 14px; text-align: center; border: 1px solid #1e3a8a; width: 25%;">Nota / Fatura</th>
                                    <th style="padding: 10px 14px; text-align: center; border: 1px solid #1e3a8a; width: 45%;">Código(s) AM</th>
                                    <th style="padding: 10px 14px; text-align: center; border: 1px solid #1e3a8a; width: 30%;">Centro de Custo</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    notasEmail.forEach((n, idx) => {
                        let amostra = n.codigosAmostra || '-';
                        let cc = n.centroCusto || '-';
                        if (amostra.toUpperCase().includes('AM1484') && cc.includes('2232')) {
                            amostra += ' <span style="color:#64748b; font-style:italic;">(Análise laboratorial)</span>';
                        }
                        const bg = idx % 2 === 0 ? '#ffffff' : '#f8fafc';
                        tabelaHtml += `
                            <tr style="background-color: ${bg};">
                                <td style="padding: 9px 14px; text-align: center; border: 1px solid #cbd5e1; color: #0f172a; font-weight: bold;">${n.numero}</td>
                                <td style="padding: 9px 14px; text-align: center; border: 1px solid #cbd5e1; color: #1e40af;">${amostra}</td>
                                <td style="padding: 9px 14px; text-align: center; border: 1px solid #cbd5e1; color: #1e40af;">${cc}</td>
                            </tr>
                        `;
                        if (incluirObsEmail && n.observacao) {
                            tabelaHtml += `
                                <tr style="background-color: #fffbeb;">
                                    <td colspan="3" style="padding: 6px 14px; font-size: 12px; color: #92400e; border: 1px solid #cbd5e1; text-align: left;">
                                        <strong>Obs/Motivo:</strong> ${n.observacao}
                                    </td>
                                </tr>
                            `;
                        }
                    });
                    tabelaHtml += `</tbody></table>`;
                } else {
                    tabelaHtml = `
                        <table style="border-collapse: collapse; width: 100%; max-width: 680px; margin: 18px 0; font-size: 13px; font-family: Arial, sans-serif; border: 1px solid #cbd5e1;">
                            <thead>
                                <tr style="background-color: #1e3a8a; color: #ffffff;">
                                    <th style="padding: 10px 14px; text-align: center; border: 1px solid #1e3a8a; width: 22%;">Nota / Fatura</th>
                                    <th style="padding: 10px 14px; text-align: center; border: 1px solid #1e3a8a; width: 50%;">Fornecedor</th>
                                    <th style="padding: 10px 14px; text-align: center; border: 1px solid #1e3a8a; width: 28%;">Valor Bruto</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    notasEmail.forEach((n, idx) => {
                        const bg = idx % 2 === 0 ? '#ffffff' : '#f8fafc';
                        tabelaHtml += `
                            <tr style="background-color: ${bg};">
                                <td style="padding: 9px 14px; text-align: center; border: 1px solid #cbd5e1; color: #0f172a; font-weight: bold;">${n.numero}</td>
                                <td style="padding: 9px 14px; text-align: center; border: 1px solid #cbd5e1; color: #1e40af;">${n.fornecedor || '---'}</td>
                                <td style="padding: 9px 14px; text-align: center; border: 1px solid #cbd5e1; color: #1e40af; font-weight: bold;">R$ ${formatMoeda(n.valor)}</td>
                            </tr>
                        `;
                        if (incluirObsEmail && n.observacao) {
                            tabelaHtml += `
                                <tr style="background-color: #fffbeb;">
                                    <td colspan="3" style="padding: 6px 14px; font-size: 12px; color: #92400e; border: 1px solid #cbd5e1; text-align: left;">
                                        <strong>Obs/Motivo:</strong> ${n.observacao}
                                    </td>
                                </tr>
                            `;
                        }
                    });
                    tabelaHtml += `</tbody></table>`;
                }

                const emailCompleto = `
                    <div style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: #1e293b; line-height: 1.6;">
                        <p style="margin-bottom: 12px;">Olá, ${saudacao.toLowerCase()}.</p>
                        <p style="margin-bottom: 16px;">${fraseAbertura}</p>
                        ${tabelaHtml}
                        <p style="margin-top: 20px; color: #475569;">Atenciosamente,</p>
                    </div>
                `;

                setModalEmailData({
                    html: emailCompleto,
                    assunto: assuntoSugerido,
                    isSingular,
                    quantidade: notasEmail.length
                });
                setCopiado(false);
            };

            useEffect(() => {
                if (modalEmailData !== null) {
                    abrirModalEmail();
                }
            }, [incluirObsEmail]);

            const copiarParaClipboard = () => {
                if (!modalEmailData?.html) return;
                const container = document.createElement('div');
                container.innerHTML = modalEmailData.html;

                container.style.pointerEvents = 'none';
                container.style.opacity = '0';

                const range = document.createRange();
                range.selectNode(container);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);

                try {
                    document.execCommand('copy');
                    setCopiado(true);
                    showToast("Texto e tabela copiados com formatação rica!", "success");
                    setTimeout(() => setCopiado(false), 2500);
                } catch (err) {
                    console.error('Falha ao copiar:', err);
                    showToast("Não foi possível copiar automaticamente.", "error");

                selection.removeAllRanges();
                document.body.removeChild(container);

                return notas.filter(n => {
                    const matchBusca = (n.numero && n.numero.toLowerCase().includes(searchTerm.toLowerCase())) ||

                                       (n.observacao && n.observacao.toLowerCase().includes(searchTerm.toLowerCase()));
                    
                    const matchStatus = filtroStatus === 'todos' || n.status === filtroStatus;
                    const matchClass = filtroClassificacao === 'todas' || (n.classificacao || 'padrao') === filtroClassificacao;
                    
                    let matchJust = true;
                    if (filtroJustificativa === 'com_obs') {
                        matchJust = !!n.observacao && n.observacao.trim() !== '';
                    } else if (filtroJustificativa === 'sem_obs') {
                        matchJust = !n.observacao || n.observacao.trim() === '';
                    }

                    return matchBusca && matchStatus && matchClass && matchJust;
                });
            }, [notas, searchTerm, filtroStatus, filtroClassificacao, filtroJustificativa]);

            const notasAgrupadas = useMemo(() => {
                return notasFiltradas.reduce((acc, nota) => {
                    const data = nota.dataLancamento || 'Sem Data';

                    acc[data].push(nota);
                    return acc;
                }, {});

                const lancadas = notas.filter(n => n.status === 'lancada').length;
                const pendentes = notas.filter(n => n.status === 'pendente').length;
                const amostras = notas.filter(n => n.status === 'aguardando_amostra').length;

                const pendentesComJustificativa = notas.filter(n => n.status !== 'lancada' && n.observacao && n.observacao.trim() !== '').length;

                                                                                            onChange={(e) => atualizarClassificacao(n.id, e.target.value)}
                                                                                            className={`w-full py-1 pl-2 pr-6 border rounded-lg text-xs font-semibold outline-none cursor-pointer appearance-none ${classConf}`}
                                                                                        >
                                                                                            <option value="padrao">Padrão</option>
                                                                                            <option value="sem_cadastro">Sem Cadastro</option>
                                                                                            <option value="manutencao">Manutenção</option>
                                                                                        </select>
                                                                                        <ChevronDown size={12} className="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none opacity-40"/>
                                                                                    </div>
                                                                                </td>

                                                                                {/* Número da Fatura e Badges de Amostra */}
                                                                                <td className="px-5 py-3 whitespace-nowrap">
                                                                                    <div className="flex flex-col items-start gap-1">
                                                                                        <span className="font-extrabold text-slate-800 font-mono-numbers">#{n.numero}</span>
                                                                                        <div className="flex flex-wrap gap-1">
                                                                                            {n.codigosAmostra && (
                                                                                                <span 
                                                                                                    onClick={() => setModalAmostra({ ...n, tempCode: n.codigosAmostra, tempCentroCusto: n.centroCusto || '' })} 
                                                                                                    className="text-[10px] text-purple-700 bg-purple-50 px-2 py-0.5 rounded border border-purple-200 flex items-center gap-1 cursor-pointer font-bold" 
                                                                                                    title="Editar amostra"
                                                                                                >
                                                                                                    <Tag size={10}/> {n.codigosAmostra}
                                                                                                </span>
                                                                                            )}
                                                                                            {n.centroCusto && (
                                                                                                <span 
                                                                                                    onClick={() => setModalAmostra({ ...n, tempCode: n.codigosAmostra || 'AM', tempCentroCusto: n.centroCusto })} 
                                                                                                    className="text-[10px] text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-200 flex items-center gap-1 cursor-pointer font-bold" 
                                                                                                    title="Editar CC"
                                                                                                >
                                                                                                    <Building2 size={10}/> {n.centroCusto}
                                                                                                </span>
                                                                                            )}
                                                                                        </div>
                                                                                    </div>
                                                                                </td>

                                                                                {/* Fornecedor */}
                                                                                <td className="px-5 py-3 text-slate-700 font-semibold truncate max-w-[200px] whitespace-nowrap">
                                                                                    {n.fornecedor || '---'}
                                                                                </td>

                                                                                {/* JUSTIFICATIVA / OBSERVAÇÃO PARA NOTAS NÃO LANÇADAS */}
                                                                                <td className="px-5 py-3 max-w-[260px]">
                                                                                    {isNaoLancada ? (
                                                                                        n.observacao ? (
                                                                                            <div 
                                                                                                onClick={() => setModalObservacao({ id: n.id, numero: n.numero, fornecedor: n.fornecedor, textoObs: n.observacao })}
                                                                                                className="group flex items-start gap-1.5 p-1.5 rounded-lg bg-amber-50 hover:bg-amber-100/80 border border-amber-200 text-amber-900 cursor-pointer transition-colors"
                                                                                                title="Clique para editar a justificativa"
                                                                                            >
                                                                                                <MessageSquare size={13} className="text-amber-600 shrink-0 mt-0.5"/>
                                                                                                <span className="text-[11px] leading-tight line-clamp-2 font-medium">
                                                                                                    {n.observacao}
                                                                                                </span>
                                                                                            </div>
                                                                                        ) : (
                                                                                            <button 
                                                                                                onClick={() => setModalObservacao({ id: n.id, numero: n.numero, fornecedor: n.fornecedor, textoObs: '' })}
                                                                                                className="text-[11px] text-amber-700 hover:text-amber-900 bg-amber-50/70 hover:bg-amber-100 border border-dashed border-amber-300 px-2 py-1 rounded-lg flex items-center gap-1 font-semibold transition-colors"
                                                                                            >
                                                                                                <Plus size={11}/> Adicionar Motivo
                                                                                            </button>
                                                                                        )
                                                                                    ) : (
                                                                                        <span className="text-slate-400 text-[11px] italic">Lançamento concluído</span>
                                                                                    )}
                                                                                </td>

                                                                                {/* Valor Bruto */}
                                                                                <td className="px-5 py-3 text-right font-extrabold text-slate-800 font-mono-numbers whitespace-nowrap">
                                                                                    R$ {formatMoeda(n.valor)}
                                                                                </td>

                                                                                {/* Anexo PDF/XML */}
                                                                                <td className="px-5 py-3 text-center whitespace-nowrap">
                                                                                    {n.arquivoNome ? (
                                                                                        <button onClick={() => abrirVisualizacao(n)} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="Visualizar documento">
                                                                                            <Paperclip size={16}/>
                                                                                        </button>
                                                                                    ) : (
                                                                                        <span className="text-slate-300">-</span>
                                                                                    )}
                                                                                </td>

                                                                                {/* Ações */}
                                                                                <td className="px-5 py-3 text-right whitespace-nowrap">
                                                                                    <div className="flex justify-end items-center gap-1">
                                                                                        <button onClick={() => setEditingNota(n)} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="Editar"><Pencil size={15}/></button>
                                                                                        {n.status !== 'lancada' && (
                                                                                            <button onClick={() => marcarLancada(n.id)} className="p-1.5 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 rounded-lg transition-colors" title="Marcar como lançada"><CheckCircle2 size={15}/></button>
                                                                                        )}
                                                                                        <button onClick={() => deletarNota(n)} className="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors" title="Excluir"><Trash2 size={15}/></button>
                                                                                    </div>
                                                                                </td>
                                                                            </tr>
                                                                        );
                                                                    })}
                                                                </tbody>
                                                            </React.Fragment>
                                                        ))
                                                    )}
                                                </table>
                                            </div>

                                            {/* Rodapé Informativo */}
                                            <div className="px-5 py-3 bg-slate-50 border-t border-slate-200 flex justify-between items-center text-xs font-bold text-slate-500">
                                                <span>{notasFiltradas.length} de {notas.length} notas listadas</span>
                                                <span className="text-slate-800 font-mono-numbers">
                                                    Subtotal: R$ {formatMoeda(notasFiltradas.reduce((acc, n) => acc + (parseFloat(n.valor) || 0), 0))}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        const extrairDados = async (file) => {
            const dataHoje = new Date().toISOString().split('T')[0];
            
            if (file.name.toLowerCase().endsWith('.pdf')) {
                try {
                    const ab = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument({ data: ab }).promise;
                    let text = '';
                    for (let i = 1; i <= Math.min(pdf.numPages, 2); i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        text += content.items.map(it => it.str).join(' ') + ' ';
                    }
                    const valorM = text.match(/R\$\s*([\d\.]+,\d{2})/i) || text.match(/Valor.*?([\d\.]+,\d{2})/i);
                    
                    const numM = text.match(/(?:NF|N[oó]ta|Nº|N)\s*[:.-]?\s*0*(\d+)/i);
                    let numLimpo = '';
                    if (numM) {
                        numLimpo = numM[1];
                    } else {
                        const fallbackM = text.match(/(?:N\s+)?0*(\d{4,})/i);
                        if(fallbackM) numLimpo = fallbackM[1];
                    }
                    
                    let emitente = '';
                    const emitMatch = text.match(/(?:IDENTIFICA[CÇ][AÃ]O DO EMITENTE|NOME\/RAZ[AÃ]O SOCIAL|RAZ[AÃ]O SOCIAL)[:\s]+([A-ZÀ-Ú0-9\s\.\&\-]{5,60})/i);
                    if (emitMatch) emitente = emitMatch[1].trim();

                    let isAmostra = false;
                    if (text.toLowerCase().includes('amostra') || text.toLowerCase().includes('brinde')) {
                        isAmostra = true;
                    }

                    return {
                        numero: numLimpo,
                        fornecedor: emitente,
                        dataLancamento: dataHoje,
                        valor: valorM ? valorM[1].replace(/\./g, '').replace(',', '.') : '',
                        isAmostra: isAmostra,
                        classificacao: 'padrao',
                        observacao: ''
                    };
                } catch(e) { 
                    return { numero: '', fornecedor: '', dataLancamento: dataHoje, valor: '', isAmostra: false, classificacao: 'padrao', observacao: '' }; 
                }
            } else {
                const text = await file.text();
                const xml = new DOMParser().parseFromString(text, "text/xml");
                const get = t => xml.getElementsByTagName(t)[0]?.textContent || '';
                
                const natOp = get('natOp').toLowerCase();
                const isAmostra = natOp.includes('amostra') || natOp.includes('brinde');

                let numeroXml = get('nNF') || get('Numero') || get('NfseNumero') || '';
                numeroXml = numeroXml.replace(/^0+/, ''); 

                return {
                    numero: numeroXml,
                    fornecedor: xml.getElementsByTagName('emit')[0]?.getElementsByTagName('xNome')[0]?.textContent || get('RazaoSocial') || '',
                    dataLancamento: dataHoje,
                    valor: get('vNF') || get('ValorServicos') || get('ValorLiquidoNfse') || '',
                    isAmostra: isAmostra,
                    classificacao: 'padrao',
                    observacao: ''
                };
            }
        };

        function FormIndividual({ onSave }) {
            const dataHoje = new Date().toISOString().split('T')[0];
            const estadoInicial = { 
                numero: '', 
                fornecedor: '', 
                dataLancamento: dataHoje, 
                valor: '', 
                status: 'pendente', 
                classificacao: 'padrao', 
                codigosAmostra: '', 
                centroCusto: '',
                observacao: ''
            };
            const [f, setF] = useState(estadoInicial);
            const [arq, setArq] = useState(null);
            const [lendo, setLendo] = useState(false);

            const handleFile = async (e) => {
                const file = e.target.files[0]; 
                if(!file) return; 
                setLendo(true);
                const d = await extrairDados(file); 
                setF(p => ({
                    ...p, 
                    ...d, 
                    status: d.isAmostra ? 'aguardando_amostra' : 'pendente',
                    codigosAmostra: d.isAmostra ? 'AM' : '' 
                }));
                const reader = new FileReader(); 
                reader.onload = (ev) => { 
                    setArq({ name: file.name, data: ev.target.result }); 
                    setLendo(false); 
                };
                reader.readAsDataURL(file);
            };

            const submitForm = (e) => {
                e.preventDefault();
                onSave({
                    ...f, 
                    id: gerarID(), 
                    arquivoNome: arq?.name, 
                    arquivoDataUrl: arq?.data, 
                    dataUpload: new Date().toISOString() 
                });
                setF(estadoInicial);
                setArq(null);
            };

            return (
                <form onSubmit={submitForm} className="bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-soft space-y-6">
                    <div className="border-2 border-dashed border-slate-300 rounded-2xl p-8 bg-slate-50/70 text-center relative group hover:bg-blue-50/40 hover:border-blue-400 transition-all cursor-pointer">
                        <input type="file" accept=".xml,.pdf" className="absolute inset-0 opacity-0 cursor-pointer z-10" onChange={handleFile} />
                        <div className={`mx-auto w-14 h-14 bg-white rounded-2xl shadow-sm border border-slate-200 flex items-center justify-center text-blue-600 mb-3 group-hover:scale-105 transition-transform ${lendo ? 'animate-pulse' : ''}`}>
                            <UploadCloud size={24} />
                        </div>
                        <p className="font-bold text-slate-800 text-sm">{arq ? arq.name : 'Selecionar Documento Digital (XML ou PDF)'}</p>
                        <p className="text-xs text-slate-500 mt-1">Extração automática de número, fornecedor e valor</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50/50 p-5 rounded-2xl border border-slate-100">
                        <div>
                            <label className="label-premium">Nº Nota Fiscal</label>
                            <input required className="input-premium font-mono-numbers" placeholder="Ex: 10423" value={f.numero} onChange={e => setF({...f, numero: e.target.value})} />
                        </div>
                        <div>
                            <label className="label-premium">Data de Lançamento</label>
                            <input type="date" required className="input-premium bg-slate-100 text-slate-600 font-semibold" value={f.dataLancamento} onChange={e => setF({...f, dataLancamento: e.target.value})} />
                        </div>
                        <div className="md:col-span-2">
                            <label className="label-premium">Parceiro / Fornecedor</label>
                            <input className="input-premium" placeholder="Razão social do emissor" value={f.fornecedor} onChange={e => setF({...f, fornecedor: e.target.value})} />
                        </div>
                        <div>
                            <label className="label-premium">Valor Bruto (R$)</label>
                            <input type="number" step="0.01" required className="input-premium font-mono-numbers font-bold" placeholder="0.00" value={f.valor} onChange={e => setF({...f, valor: e.target.value})} />
                        </div>
                        <div>
                            <label className="label-premium">Status Inicial</label>
                            <div className="relative">
                                <select className="input-premium cursor-pointer appearance-none pr-8 font-semibold" value={f.status} onChange={e => setF({...f, status: e.target.value})}>
                                    <option value="pendente">Pendente</option>
                                    <option value="aguardando_amostra">Aguard. Amostra</option>
                                    <option value="lancada">Lançada</option>
                                </select>
                                <ChevronDown size={14} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
                            </div>
                        </div>

                        {/* Campo Justificativa se Pendente */}
                        {f.status !== 'lancada' && (
                            <div className="md:col-span-2 bg-amber-50/80 p-4 rounded-xl border border-amber-200">
                                <label className="label-premium text-amber-800 flex items-center gap-1.5">
                                    <MessageSquare size={13}/> Justificativa da Pendência (Opcional)
                                </label>
                                <input 
                                    className="input-premium border-amber-200 focus:border-amber-500 text-xs bg-white" 
                                    placeholder="Ex: Aguardando conferência física de lote / frete pendente" 
                                    value={f.observacao} 
                                    onChange={e => setF({...f, observacao: e.target.value})} 
                                />
                            </div>
                        )}

                        {f.status === 'aguardando_amostra' && (
                            <div className="md:col-span-2 bg-purple-50 p-4 rounded-xl border border-purple-100 grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="label-premium text-purple-700"><Tag size={13}/> Código da Amostra (AM)</label>
                                    <input className="input-premium border-purple-200 text-xs" placeholder="Ex: AM123" value={f.codigosAmostra} onChange={e => setF({...f, codigosAmostra: e.target.value})} />
                                </div>
                                <div>
                                    <label className="label-premium text-purple-700"><Building2 size={13}/> Centro de Custo</label>
                                    <input className="input-premium border-purple-200 text-xs" placeholder="Ex: 2232" value={f.centroCusto} onChange={e => setF({...f, centroCusto: e.target.value})} />
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="flex justify-end">
                        <button type="submit" className="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-blue-700 transition-all flex items-center gap-2 shadow-sm">
                            <Save size={16}/> Salvar Registro
                        </button>
                    </div>
                </form>
            );
        }

        function FormLote({ onSave }) {
            const [l, setL] = useState([]); 
            const [p, setP] = useState(false);

            const handleFiles = async (e) => {
                setP(true); 
                const files = Array.from(e.target.files);
                const novas = await Promise.all(files.map(async file => {
                    const d = await extrairDados(file);
                    const b64 = await new Promise(res => { 
                        const r = new FileReader(); 
                        r.onload = ev => res(ev.target.result); 
                        r.readAsDataURL(file); 
                    });
                    const definedStatus = d.isAmostra ? 'aguardando_amostra' : 'pendente';
                    return { 
                        ...d, 
                        id: gerarID(), 
                        arquivoNome: file.name, 
                        arquivoDataUrl: b64, 
                        status: definedStatus, 
                        dataUpload: new Date().toISOString() 
                    };
                }));
                setL(prev => [...prev, ...novas]); 
                setP(false);
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-12 border-2 border-dashed border-slate-300 rounded-3xl text-center relative group hover:border-blue-400 hover:bg-blue-50/40 transition-all cursor-pointer shadow-soft">
                        <input type="file" multiple accept=".xml,.pdf" className="absolute inset-0 opacity-0 cursor-pointer z-10" onChange={handleFiles} />
                        <div className={`mx-auto w-16 h-16 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-600 mb-4 transition-transform border border-blue-100 group-hover:scale-105 ${p ? 'animate-pulse' : ''}`}>
                            <UploadCloud size={30} />
                        </div>
                        <p className="font-extrabold text-lg text-slate-800">Arraste múltiplos arquivos aqui</p>
                        <p className="text-slate-500 font-medium text-xs mt-1">Carregue simultaneamente dezenas de XMLs ou PDFs.</p>
                    </div>
                    
                    {l.length > 0 && (
                        <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-soft animate-fade-in">
                            <div className="px-5 py-3.5 bg-slate-50 border-b border-slate-200 flex justify-between items-center text-xs">
                                <span className="font-extrabold text-slate-800 bg-white px-2.5 py-1 rounded border border-slate-200">
                                    {l.length} {l.length === 1 ? 'Arquivo Pronto' : 'Arquivos Prontos'}
                                </span>
                                <button onClick={() => setL([])} className="text-rose-600 font-bold hover:underline">Limpar Lista</button>
                            </div>
                            <div className="max-h-80 overflow-y-auto divide-y divide-slate-100 text-xs">
                                {l.map(x => (
                                    <div key={x.id} className="p-3.5 flex items-center justify-between hover:bg-slate-50">
                                        <div>
                                            <span className="font-bold text-slate-800 block">NF #{x.numero || 'S/N'}</span>
                                            <span className="text-slate-400 truncate max-w-xs block text-[11px]">{x.arquivoNome}</span>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <span className="font-mono-numbers font-bold text-slate-700">R$ {formatMoeda(x.valor)}</span>
                                            <button onClick={() => setL(l.filter(it => it.id !== x.id))} className="text-slate-400 hover:text-rose-600 p-1">
                                                <Trash2 size={15}/>
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="p-4 bg-slate-50 border-t border-slate-200">
                                <button onClick={() => { onSave(l); setL([]); }} className="w-full bg-blue-600 text-white py-2.5 rounded-xl font-bold hover:bg-blue-700 transition-all flex justify-center items-center gap-2 text-xs">
                                    <Save size={16}/> Salvar {l.length} {l.length === 1 ? 'Registo' : 'Registos'} no Banco de Dados
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function SidebarItem({ active, onClick, icon, label, expanded, badge }) {
            return (
                <div className="px-1">
                    <button 
                        onClick={onClick} 
                        className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl transition-all text-xs relative ${active ? 'sidebar-active-brand' : 'text-slate-600 hover:bg-slate-100 font-bold'}`}
                    >
                        <div className="flex items-center gap-3">
                            <span className={`${active ? 'text-blue-600' : 'text-slate-400'}`}>{icon}</span> 
                            <span className={!expanded ? 'hidden' : ''}>{label}</span>
                        </div>
                        {badge > 0 && expanded && (
                            <span className="bg-amber-100 border border-amber-200 text-amber-800 text-[10px] px-1.5 py-0.5 rounded-full font-extrabold">
                                {badge}
                            </span>
                        )}
                    </button>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
